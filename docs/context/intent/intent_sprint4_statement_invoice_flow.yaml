validation:
  context:
    - "context_loader.py 基线 PASS"
  static:
    - "verify.py 当前版本全部强制门禁 PASS"
  build:
    - "Python/XML/Odoo19 兼容校验 PASS"
  runtime:
    - "宿主机常驻 + XML-RPC 模块升级验证通过（odoo_check.py）"
    - "结算单状态流转（draft → voided / confirmed → draft_invoice）与草稿发票生成断言 PASS"
  business_review:
    - "业务负责人人工验收通过"
  snapshot:
    verify_gate_count: 18
    note: "历史快照，仅记录执行时门禁数量，不作为验收标准"

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  scope_expansion:
    allowed: false
    require_human: true
  escalation:
    after_failed_iteration: 3
    require_human: true
  stop_condition:
    success:
      - all_validation_pass
      - human_accept
    hard_stop:
      - risk_block
      - scope_violation
      - forbidden_change
      - new_unknown

affected_assets:
  business:
    - business_rules
    - knowledge_classification
  architecture:
    - module_map
  governance: []
  history:
    - decision_note
    - sprint_log

execution_artifacts:
  intent_records:
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-001/"
  validation_records:
    - "docs/context/validation/test_exec_records.yaml"
  context_version:
    - "docs/context/context_version.yaml"

success_definition:
  - "货运单费用可通过 wizard 生成结算单草稿且金额汇总正确"
  - "结算单草稿费用行不可编辑（metadata_only），货运单费用可继续修改"
  - "客户拒绝后当前结算单作废，费用释放为可修改"
  - "费用修改回到 freight.shipment / freight.service，不在结算单行直接编辑"
  - "重新生成新结算单形成新版本，旧结算单不可变"
  - "客户接受后进入 confirmed，费用锁定"
  - "仅 confirmed 结算单可生成草稿应收发票；草稿发票 header 可追溯至结算单，结算单行可追溯至货运单费用"
  - "草稿发票不代表过账，开票申请预留节点不开发"
  - "同一 confirmed 结算单仅一张草稿发票，重复动作返回已有草稿发票"
  - "旧 action_create_invoice 直接调用被拦截并提示走 Statement 流程"
  - "结算单生成/作废/确认/草稿发票生成记录操作人与时间"
  - "税率/税额/含税/不含税金额完整且手工调整以 tax_amount 为权威"
  - "明细行本币/原币保留完整，按币种汇总本币与原币金额"
  - "B-23 ~ B-42 与 Context 审计记录完整"
  - "所有强制验证通过"

deliverables:
