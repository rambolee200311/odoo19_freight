# ==============================================================
# Intent: Sprint4 结算单与草稿应收发票流程
# 修订：按评审将状态机对齐为“拒绝→作废→修改费用→新结算单→接受→草稿发票”
# ==============================================================

intent_id: "INT-FREIGHT-SPRINT4-001"
sprint_version: "Sprint4-Statement-Invoice-Flow"
intent_work_type: "Development"
intent_change_type: "New Feature"
title: "货运单费用 → 结算单草稿/客户核对/作废 → 新结算单 → 客户接受 → 草稿应收发票"
target_scope: "新增客户结算单状态机（draft → voided / confirmed → draft_invoice），生成入口为 wizard 勾选费用行；供应商账单为供应商原始账单，不纳入本 Sprint 主流程"

context_binding:
  bind_context_version: "0.1.41"
  asset_snapshot_profile: "development"

context_policy:
  bind_version_immutable: true
  post_execution_context_update_allowed: true
  resulting_context_version: "auto"

business_intent:
  source:
    type: "customer_demand"
    origin_team: "业务负责人（用户）"
    confirmation_ref: "Sprint3-002 分析确认 + Sprint4 Intent 评审"
  confirmed_decisions:
    - id: "B-23"
      decision_ref: "U-02"
      decision_status: "CONFIRMED"
      statement: "对账单折算默认取当前汇率，允许用户录入结算汇率覆盖"
      rule_refs: ["BR-23"]
    - id: "B-24"
      decision_ref: "U-01"
      decision_status: "CONFIRMED"
      statement: "费用行整行进一张发票，禁止行内分批/部分开票"
      rule_refs: ["BR-24"]
    - id: "B-26"
      decision_ref: "U-04"
      decision_status: "CONFIRMED"
      statement: "服务/产品档案新增税目编码、税目名称；手工调整税额按 tax_amount 权威落账"
      rule_refs: ["BR-26"]
    - id: "B-30"
      decision_ref: "U-24"
      decision_status: "CONFIRMED"
      statement: "旧开票入口隐藏，保留方法与兼容调用能力"
      rule_refs: ["BR-30"]
    - id: "B-31"
      decision_ref: "U-25"
      decision_status: "CONFIRMED"
      statement: "Statement 编号规则：STM/年月/4位流水码"
      rule_refs: ["BR-31"]
    - id: "B-33"
      decision_ref: "U-27"
      decision_status: "CONFIRMED"
      statement: "自动生成费用行通过对账单状态管理，客户确认后生成发票"
      rule_refs: ["BR-33"]
    - id: "B-35"
      decision_ref: "U-29"
      decision_status: "CONFIRMED"
      statement: "供应商成本行排除在客户对账单外"
      rule_refs: ["BR-35"]
    - id: "B-36"
      decision_ref: "U-30"
      decision_status: "CONFIRMED"
      statement: "客户 reject 的对账单作废，释放费用为可修改状态"
      rule_refs: ["BR-36"]
    - id: "B-37"
      decision_ref: "U-31"
      decision_status: "CONFIRMED"
      statement: "confirmed 后强制版本化，已确认版本不可原地修改"
      rule_refs: ["BR-37"]
    - id: "B-38"
      decision_ref: "U-32"
      decision_status: "CONFIRMED"
      statement: "不建立 Statement Line ↔ Invoice Line 行级关联，仅 header 级 statement ↔ invoice 关联"
      rule_refs: ["BR-38"]
    - id: "B-39"
      decision_ref: "决策33"
      decision_status: "CONFIRMED"
      statement: "生成结算单使用向导，在列表行勾选费用行生成结算单"
      rule_refs: ["BR-39"]
    - id: "B-40"
      decision_ref: "决策34"
      decision_status: "CONFIRMED"
      statement: "客户拒绝后费用修改必须回到 freight.shipment / freight.service，结算单本身不可编辑费用"
      rule_refs: ["BR-40"]
    - id: "B-41"
      decision_ref: "决策34"
      decision_status: "CONFIRMED"
      statement: "客户接受后生成草稿应收发票（account.move draft），草稿不代表已过账"
      rule_refs: ["BR-41"]
    - id: "B-42"
      decision_ref: "决策34"
      decision_status: "CONFIRMED"
      statement: "开票申请为预留业务节点，本 Sprint 不开发模型/按钮/审批流/状态机/权限"
      rule_refs: ["BR-42"]
  unresolved_unknowns: []

unknown_policy:
  unresolved_unknowns_allowed: false
  newly_discovered_unknown_action: "stop_and_escalate"

