business_flow:
  - "货运单录入客户应收费用"
  - "Wizard 勾选可结算费用行"
  - "生成应收结算单 Draft"
  - "客户核对"
  - "客户拒绝 → 当前结算单 Void"
  - "回 freight.shipment / freight.service 修改费用"
  - "重新选择费用行生成新的结算单 Version"
  - "客户接受 → Statement Confirmed"
  - "开票申请：预留业务节点，本 Sprint 不开发"
  - "通过已确认结算单生成草稿应收发票"

state_machine:
  initial_state: "draft"
  states:
    draft:
      editable: false
      editable_scope: "metadata_only"
      allowed_next: [voided, confirmed]
      note: "结算单费用行由 freight.service 快照生成，不允许直接编辑；客户拒绝前如需修改费用，回货运单费用层修改后重新生成结算单"
    voided:
      editable: false
      allowed_next: []
      note: "客户拒绝后作废；旧结算单不可变，费用修改后重新生成新结算单"
    confirmed:
      editable: false
      allowed_next: [draft_invoice]
      allowed_actions:
        - "generate_draft_invoice"
      note: "客户接受；不可原地修改，变更必须重新生成新结算单"
    draft_invoice:
      editable: false
      allowed_next: []
      meaning: "已生成草稿应收发票"
      invoice_state: "account.move.state = draft"
      note: "表示已由该结算单生成草稿应收发票，不代表发票已过账"
  reserved_nodes:
    invoice_application:
      status: "business_process_reserved"
      development_scope: "excluded"
  state_invariants:
    - "draft：费用行来源于当前有效货运单费用快照，不直接在结算单行编辑"
    - "voided：旧结算单及其费用快照不可修改"
    - "confirmed：客户已接受，不可编辑；变更必须重新生成新结算单"
    - "draft_invoice：仅允许生成草稿应收发票，禁止直接过账"

version_policy:
  mode: "regenerate_as_new_version"
  rule:
    - "客户拒绝后当前结算单作废（voided），不可修改"
    - "费用修改回到 freight.shipment / freight.service"
    - "重新生成新结算单，形成新版本"
    - "新版本通过 statement_id + version_no + previous_statement_id 建立版本链"
    - "旧结算单及其费用快照保持不可变"

statement_identity:
  business_key:
    - "freight_operation_id"
    - "customer_id"
  rule:
    - "同一 freight_operation_id + customer_id 只能存在一个非 voided 的当前活动结算单"
    - "voided 结算单永久保留，不参与当前活动结算单唯一性判断"
    - "新结算单生成时，如存在非 voided 结算单，必须阻止重复生成或明确替换规则"
    - "version_no 仅用于版本链编号，不作为当前活动结算单唯一性判定的依据"

statement_scope:
  confirmed: "结算单对象仅为客户（AR），不实现 supplier statement"
  supplier_bills: "供应商账单由供应商提供原始账单，本 Sprint 不开发 Vendor Bill 生成流程"

wizard_constraints:
  - "一次 wizard 只能选择同一 freight_operation_id"
  - "一次 wizard 只能选择同一 customer_id"
  - "供应商成本费用不可选择"
  - "已进入有效结算单的费用不可重复选择"
  - "已作废结算单对应费用可以重新选择"

statement_line_eligibility:
  allowed:
    - "客户应收费用行"
    - "service_type 属于 shipper / consignee 的有效费用"
    - "具有 customer/partner 开票对象"
  forbidden:
    - "vendor 成本费用"
    - "已进入有效结算单且未被作废释放的费用"
    - "无明确开票对象（shipper_id / consignee_id）的自动生成费用行（TD-015，需先在费用层补齐）"

tax_master_scope:
  model: "product.template（产品档案）"
  fields:
    - "tax_code"
    - "tax_name"
  note: "freight.service 通过 service_id 引用产品档案税目信息；不新增独立税率模型"

invoice_idempotency:
  - "同一 confirmed statement 不得生成两张草稿发票"
  - "重复执行生成草稿发票动作必须返回已有草稿发票"
  - "已生成 draft_invoice 的 statement 不得再次生成新的草稿发票"

audit_events:
  events:
    - "结算单生成记录操作人和时间"
    - "结算单作废记录操作人和时间"
    - "结算单确认记录操作人和时间"
    - "草稿发票生成记录操作人和时间"
  note: "复用现有审计机制（mail.thread / audit_spec），不新增复杂审计模型"

non_inference_rules:
  - "不得因为存在 confirmed 状态而自行实现 dispute 状态"
  - "不得因为存在版本链而允许在旧 Statement 上修改费用"
  - "不得因为存在 draft invoice 而实现自动过账"
  - "不得因为存在 invoice_application 预留节点而开发开票申请"
  - "不得因为存在 Vendor Bill 兼容方法而开发供应商账单流程"
  - "不得实现 invoice line ↔ statement line 关联"
  - "不得实现分批开票或部分开票"
  - "不得实现 confirmed 后原地修改费用"

file_scope_constraints:
  freight_shipment.py:
    allowed:
      - "新增 statement 关联字段"
      - "新增结算单生成 wizard 调用入口"
      - "新增与 Statement 状态联动所必需的最小校验"
    forbidden:
      - "重构 freight.service 费用计算"
      - "修改既有费用自动生成逻辑"
      - "修改现有收入/成本计算"
  freight_configuration.py:
    allowed:
      - "仅新增本 Sprint 已确认的税率/税目配置字段（product.template 继承）"
    forbidden:
      - "修改现有费用自动生成逻辑"
      - "修改现有费用计算逻辑"
      - "修改既有配置行为"

tax_policy:
  calculated:
    - "费用行无税率默认不含税"
    - "tax_amount = untaxed_amount × tax_rate（自动计算）"
  manual_adjustment:
    allowed: true
    authority_field: "tax_amount"
    rule:
      - "手工调整后 tax_amount 为真实来源"
      - "tax_rate 仅作参考，不再强制数学一致"
  total:
    - "total_amount = untaxed_amount + tax_amount"
    - "结算单汇总按上述口径逐行汇总"

source_traceability:
  required_chain:
    - "freight.shipment"
    - "freight.service"
    - "freight.statement"
    - "account.move"
  rule:
    - "草稿发票 header 必须能够追溯至 freight.statement"
    - "freight.statement.line 必须能够追溯至 freight.service"
    - "本 Sprint 不要求 account.move.line 与 freight.statement.line 建立直接关联"

legacy_invoice_entry:
  action_create_invoice:
    preserve: true
    primary_entry: false
    user_entry: "disabled_or_hidden"
    ui_visible: false
    direct_call:
      allowed: false
      behavior: "拒绝创建发票并提示必须通过 Statement 流程"
    reason: "保留方法与兼容调用能力；从正常业务 UI 隐藏，且直接调用必须被新流程拦截（B-30）"
  action_create_vendor_bill:
    preserve: true
    primary_entry: false
    user_entry: "preserved_background"
    reason: "供应商账单由供应商提供原始账单，Sprint4 不开发 Vendor Bill 生成流程；仅保留兼容"

currency_policy:
  baseline:
    - "金额字段使用 Odoo monetary 字段与精度"
    - "明细行允许本币/原币，保留原币金额与本币折算金额"
    - "汇总金额按币种分别展示本币与原币口径"
    - "禁止跨币种合并汇总或直接相加"
    - "结算单折算默认取当前汇率，允许用户录入结算汇率覆盖（B-23）"
    - "每日汇率自动同步为独立技术债 TD-026（Deferred），不在本 Sprint 主开发范围"

permission_policy:
  scope: "仅新增新模型 ACL（ir.model.access.csv 新增记录），不修改既有 security group / record rule"
  state_level_control: "本 Sprint 不实现状态级业务权限控制"

technical_constraints:
  - "新增 freight.statement / freight.statement.line，状态机 draft → voided / confirmed → draft_invoice"
  - "结算单草稿费用行不可编辑（metadata_only），货运单费用可继续修改"
  - "客户拒绝后只能作废当前结算单，不得进入 dispute 编辑"
  - "费用修改必须回到 freight.shipment / freight.service"
  - "已作废结算单不得直接编辑费用行"
  - "新结算单从当前有效货运单费用重新生成"
  - "旧结算单及其费用快照保持不可变"
  - "仅 confirmed 结算单允许生成草稿应收发票"
  - "草稿发票来源于已接受结算单，不允许跳过结算单直接生成"
  - "生成草稿发票不等于过账，后续财务处理属于 Odoo Accounting"
  - "不开发开票申请功能（模型/按钮/审批流/状态机/角色权限）"
  - "不修改 account 模块"
  - "发票必须携带 freight_operation_id，header 级关联 freight_statement_id（B-38），不做行级关联"
  - "旧 action_create_invoice 从正常业务 UI 隐藏，直接调用必须被拦截并提示走 Statement 流程；action_create_vendor_bill 仅保留兼容，不作为主流程"
  - "草稿发票生成必须满足 invoice_idempotency（同一 confirmed statement 仅一张草稿发票）"
  - "结算单生成/作废/确认/草稿发票生成必须记录操作人与时间（audit_events，复用现有审计机制）"
  - "费用行无税率默认不含税；结算单记录税率、税额、含税金额、不含税金额；手工调整后 tax_amount 为权威字段"
  - "product.template 新增 tax_code / tax_name（B-26，tax_master_scope）"
  - "分批开票、未开票余额跟踪、开票后调整不在本 Sprint 范围"

