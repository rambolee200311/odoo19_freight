    - "修改既有业务口径（BR-01 ~ BR-14）"
    - "直连 SQL 绕过 ORM"
    - "删除/重命名遗留兼容字段、方法、向导"
    - "直接修改已作废/已确认结算单的费用行"
    - "修改 freight_configuration.py / freight_shipment.py 中与本 Sprint 无关的既有逻辑"
    - "新建 data XML（mymodules/tk_freight/data/ 保持 forbidden）"
    - "本 Sprint 不开发开票申请功能（模型/按钮/表单审批流/状态机/角色权限）"
    - "本 Sprint 不开发供应商账单创建流程 / Vendor Bill 自动生成"
    - "本 Sprint 不实现 dispute / partially_invoiced / invoiced / adjusted 状态"
    - "本 Sprint 不实现分批开票、未开票余额跟踪、开票后调整流程"
    - "不得实现 invoice line ↔ statement line 关联"
    - "不得实现 confirmed 后原地修改费用"

change_boundary:
  functional_code:
    - "mymodules/tk_freight/models/__init__.py"
    - "mymodules/tk_freight/models/freight_shipment.py"
    - "mymodules/tk_freight/models/freight_configuration.py"
    - "mymodules/tk_freight/models/freight_statement.py"
    - "mymodules/tk_freight/wizard/"
