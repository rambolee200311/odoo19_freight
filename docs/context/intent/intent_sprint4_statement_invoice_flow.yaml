  parent: ""
  groups: []

translation_constraints:
  - "仅新增本流程涉及的结算单/状态/按钮文案"
  - "禁止批量重译或修改非本流程翻译"

invariants:
  unchanged_menu_roots: []
  unchanged_menu_semantics: []
  moved_menu_groups: []
  unchanged_business_behavior:
    - "BR-01 ~ BR-14 保持不变"
    - "本 Sprint 仅实现本契约确认的业务闭环（draft → voided / confirmed → draft_invoice）"
    - "不得通过修改既有业务规则解决本 Sprint 实现问题"
  unchanged_permissions:
    - "不修改既有 security group / record rule"
  forbidden_menu_changes: []
  statement_invariants:
    - "同一 freight_operation_id + customer_id 仅一个非 voided 的当前活动结算单"
    - "结算单金额按确认快照的税率/税额/含税/不含税口径汇总"
    - "作废结算单不可修改，旧快照保持不可变"
    - "费用修改必须回到 freight.shipment / freight.service"
    - "仅 confirmed 结算单可生成草稿应收发票"

acceptance_criteria:
  functional:
    - "货运单费用可通过 wizard 勾选费用行生成结算单草稿"
    - "客户拒绝后结算单转为 voided 状态"
    - "作废结算单不可继续编辑"
    - "费用修改必须在 freight.shipment / freight.service 层完成"
    - "修改后可重新生成新的结算单"
