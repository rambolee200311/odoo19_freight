  - "版本链（statement_id + version_no + previous_statement_id）"
  - "草稿应收发票生成与 header 级来源追溯（B-38）"
  - "BR-23 ~ BR-42 业务规则登记"
  - "docs/context/history/decision_note.md 与 docs/context/context_version.yaml 更新"
  - "完整 Intent 执行记录（docs/context/intent_records/INT-FREIGHT-SPRINT4-001/）"

audit:
  intent_records: "docs/context/intent_records/INT-FREIGHT-SPRINT4-001/"

risk_precheck:
