  - "结算单生成 wizard（列表勾选费用行，B-39）"
  - "货运单费用录入 + 结算单生成/作废/确认/草稿发票视图"
  - "新模型 ACL、i18n 文案、__manifest__.py 注册（不新建 data XML，data/ 保持 forbidden）"
