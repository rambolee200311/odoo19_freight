validation:
  context:
    required_version: "0.1.91"
    command: "context_loader.py"
    expected: "PASS"
    bind_version_must_match: true
  static:
    - "verify.py 全部强制门禁 PASS"
  build:
    - "Python/XML/Odoo19 兼容校验 PASS"
  runtime:
    server_side:
      - "常驻 Odoo + button_immediate_upgrade 通过"
      - "odoo shell 断言：report 存在、模型正确、forwarder_contact 冻结、action_print_statement 四状态可打印、打印不写业务数据"
      - "amount 一致性校验：statement.amount_total != sum(amount_total_company) 时 stop_and_report，不生成 PDF"
    pdf:
      - "生成真实 PDF 并渲染检查：标题、公司信息、客户、单据元数据、费用表、汇总、账户、条款、签章区"
      - "中文不乱码、表格边框完整、多页表头重复、负数/多币种无溢出"
      - "版本独立：V1 打印 -> 生成 V2 -> 再打印 V1，V1 PDF 与 V1 快照一致"
    browser:
      - "Statement 表单点击输出结算单，PDF 可打开"
      - "draft / confirmed / draft_invoice / voided 均可打开 PDF"
      - "历史版本打开后打印的是该版本内容"
  business_review:
    - "业务负责人人工验收通过"
  snapshot:
    verify_gate_count: 18
    note: "verify.py 18 项门禁为当前基线"

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  scope_expansion:
    allowed: false
    require_human: true
  stop_condition:
    success:
      - all_validation_pass
      - human_accept
    hard_stop:
      - risk_block
      - scope_violation
      - forbidden_change
      - new_unknown

affected_assets:
  business:
    - business_rules
  architecture: []
  governance: []
  history:
    - decision_note
    - sprint_log

