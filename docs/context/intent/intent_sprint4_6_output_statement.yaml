# ==============================================================
# Intent: Sprint4-6 打印对账单（Statement PDF）
# 状态：已实现（B-76 ~ B-83；用户自主完成并已打印验收）
# 核心定位：
#   - freight.statement -> QWeb -> PDF
#   - 打印不改变任何业务状态，不涉及发票 / account.move / 开票流程
# ==============================================================

intent_id: "INT-FREIGHT-SPRINT4-6-001"
sprint_version: "Sprint4-6-Print-Statement"
intent_work_type: "Development"
intent_change_type: "Business Function"
title: "Confirmed Statement 打印对账单"
target_scope:
  - "为 freight.statement 增加正式对账单打印功能"
  - "打印内容来源于 Statement 及 Statement Line"
  - "不涉及发票生成、account.move 或开票流程"

context_binding:
  bind_context_version: "0.1.94"
  asset_snapshot_profile: "development"

context_policy:
  bind_version_immutable: true
  post_execution_context_update_allowed: true
  resulting_context_version: "auto"

business_intent:
  source:
    type: "customer_demand"
    origin_team: "业务负责人（用户）"
  related_sprint:
    - "INT-FREIGHT-SPRINT4-001"
  downstream_sprint:
    - "未来 Sprint：客户确认后生成发票（不纳入本 Sprint）"
  confirmed_decisions:
    - id: "B-76"
      decision_status: "CONFIRMED"
      statement: "四种 Statement 状态均可打印，打印不改变状态"
      rule_refs: ["BR-76"]
    - id: "B-77"
      decision_status: "CONFIRMED"
      statement: "费用明细首列使用 statement.line.product_id.name"
      rule_refs: ["BR-77"]
    - id: "B-78"
      decision_status: "CONFIRMED"
      statement: "使用现有 Company 字段；新增 forwarder_contact，仅用于 Statement 抬头"
      rule_refs: ["BR-78"]
    - id: "B-79"
      decision_status: "CONFIRMED"
      statement: "收款账户来自当前 statement.company_id.bank_ids，按币种展示"
      rule_refs: ["BR-79"]
    - id: "B-80"
      decision_status: "CONFIRMED"
      statement: "多币种按原币分组；RMB 总应收直接使用 amount_total_company 汇总"
      rule_refs: ["BR-80"]
    - id: "B-81"
      decision_status: "CONFIRMED"
      statement: "打印数据来自当前 Statement 自身及 Statement Line 快照，禁止从 freight.service / account.move 重算"
      rule_refs: ["BR-81"]
    - id: "B-82"
      decision_status: "CONFIRMED"
      statement: "Statement 版本独立打印，打印 V1 永远使用 V1 自身快照"
      rule_refs: ["BR-82"]
    - id: "B-83"
      decision_status: "CONFIRMED"
      statement: "statement.amount_total 与 line 汇总不一致时停止打印并报错"
      rule_refs: ["BR-83"]
  unresolved_unknowns: []

unknown_policy:
  unresolved_unknowns_allowed: false
  newly_discovered_unknown_action: "stop_and_escalate"

decision_gate:
  status: "satisfied"
  required_before_coding: []

report_identity:
  report_name: "tk_freight.customer_statement_report"
  report_xml_id: "tk_freight.freight_statement_report"
  report_model: "freight.statement"
  report_type: "qweb-pdf"
  paper: "A4 Portrait"
  source_doc: "docs/reports/应收对账单原始单据.md"
  source_priority:
    layout_authority: "source_doc"
    visual_reference: "docs/reports/应收对账单.pdf"
  layout:
    horizontal_overflow: "forbidden"
    vertical_overflow: "natural_pagination"
    repeated_table_header: true

data_source_contract:
  statement_data:
    source: "当前打印的 freight.statement / freight.statement.line"
    rule: "费用、客户、金额、运输信息使用 Statement 自身数据"
  company_data:
    source: "statement.company_id 当前公司主数据"
    fields:
      - "name"
      - "logo"
      - "phone"
      - "email"
      - "bank_ids"
    rule: "缺失时隐藏，不阻断打印"
  forbidden:
    - "从 freight.service 重算费用"
    - "从 account.move 获取金额"
    - "切换到 current version"

print_source:
  header:
    - "Statement No"
    - "Customer"
    - "Statement Date"
    - "Freight Operation"
  lines:
    - "Description"
    - "Quantity"
    - "Unit Price"
    - "Tax"
    - "Amount"
  totals:
    - "Subtotal"
    - "Tax"
    - "Total"

amount_contract:
  display_total: "statement.amount_total"
  validation_total: "sum(statement.line.amount_total_company)"
  consistency_required: true
  inconsistency_action: "stop_and_report"
  qweb_calculation: "forbidden"

forwarder_contact:
  purpose: "仅用于结算单抬头展示"
  type: "optional Char"
  lifecycle: "draft 可编辑；确认后冻结"
  not_used_for:
    - "状态判断"
    - "费用计算"
    - "发票计算"

transport_mode_contract:
  mode_field: "freight_operation_id.transport"
  mode_values: ["air", "ocean", "land"]
  rule: "必须使用正式字段 transport 选择字段组，禁止通过字段是否为空猜测"
  mapping: "详见 report specification / source_doc"

terms_block:
  mode: "template_static"
  text_policy:
    source: "docs/reports/应收对账单原始单据.md"
    modification: "forbidden"
    rule: "条款文本不得润色、改写、翻译、纠错或自行补充"

print_entry_contract:
  canonical_entry: "action_print_statement"
  rules:
    - "所有正式打印必须经过 action_print_statement"
    - "打印前执行 amount consistency check"
    - "校验失败不得生成 PDF"
    - "打印不创建/修改任何业务数据"
  state_ui:
    draft: true
    confirmed: true
    draft_invoice: true
    voided: true

business_flow:
  - "Confirmed Statement"
  - "点击 Print Statement"
  - "生成 Statement PDF"
  - "用户查看/下载/打印"

scope:
  allowed_files:
    - "docs/context/intent/intent_sprint4_6_output_statement.yaml"
    - "mymodules/tk_freight/models/freight_statement.py"
    - "mymodules/tk_freight/views/freight_statement_view.xml"
    - "mymodules/tk_freight/__manifest__.py"
    - "mymodules/tk_freight/report/"
    - "mymodules/tk_freight/i18n/zh_CN.po"
    - "docs/context/business/business_rules.yaml"
    - "docs/context/history/decision_note.md"
    - "docs/context/history/sprint_log.md"
    - "docs/context/context_version.yaml"
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-6-001/"
    - "docs/context/validation/test_exec_records.yaml"
  forbidden_paths:
    - "odoo/"
    - "addons/"
    - "mymodules/tk_freight/wizard/"
    - "mymodules/tk_freight/security/"
    - "mymodules/tk_freight/data/"
    - "mymodules/tk_freight/controllers/"
    - "mymodules/tk_freight/static/"
    - "mymodules/tk_freight/models/freight_shipment.py"
    - "mymodules/tk_freight/models/freight_configuration.py"
    - "mymodules/tk_freight/views/menus.xml"
  forbidden_changes:
    - "account.move"
    - "account 模块"
    - "freight.service 业务逻辑"
    - "开票申请"
    - "发票审批"
    - "发票状态机"
    - "自动过账"
    - "新增 Invoice Line 关联"
    - "修改 Statement 状态机/版本链"
    - "修改 fee_state"

change_boundary:
  functional_code:
    - "mymodules/tk_freight/report/customer_statement_report.xml"
    - "mymodules/tk_freight/models/freight_statement.py"
    - "mymodules/tk_freight/views/freight_statement_view.xml"
    - "mymodules/tk_freight/__manifest__.py"
  translation:
    - "mymodules/tk_freight/i18n/zh_CN.po"
  context_audit:
    - "docs/context/history/decision_note.md"
    - "docs/context/history/sprint_log.md"
    - "docs/context/context_version.yaml"
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-6-001/"
    - "docs/context/validation/test_exec_records.yaml"

technical_constraints:
  - "QWeb PDF，模型 freight.statement"
  - "A4；禁止横向溢出，允许纵向自然分页，表头重复"
  - "打印仅产生 PDF，不创建/修改业务数据"
  - "金额一致性校验在 action_print_statement 中执行，QWeb 不重算"
  - "条款原文禁止改写"
  - "不引入 Report Wizard / 独立 Snapshot Model / Python PDF 生成器 / 银行账户快照模型 / 邮件 / Portal"

invariants:
  unchanged_business_behavior:
    - "statement 状态机与版本链不变"
    - "fee_state 语义与费用锁定不变"
    - "既有 Statement 业务逻辑不变"
  unchanged_permissions:
    - "不修改既有 security group / record rule"
  forbidden_menu_changes: []

acceptance_criteria:
  - "Confirmed Statement 显示 Print Statement"
  - "点击后能够生成 PDF"
  - "PDF 中 Statement 基本信息正确"
  - "PDF 中 Statement Lines 与系统数据一致"
  - "金额、税额、合计正确"
  - "Draft/Voided 是否允许打印按既有业务规则执行"
  - "打印不创建 account.move"
  - "打印不修改 freight.service"
  - "打印当前所选 Statement 版本，不切换到 current version"
  - "真实浏览器点击验证通过"

validation:
  context:
    required_version: "0.1.94"
    command: "context_loader.py"
    expected: "PASS"
    bind_version_must_match: true
  static:
    - "verify.py 全部强制门禁 PASS"
  build:
    - "Python/XML/Odoo19 兼容校验 PASS"
  runtime:
    server_side:
      - "模块升级通过"
      - "report 存在且模型正确"
      - "action_print_statement 返回 PDF 且不写业务数据"
      - "amount 不一致时 stop_and_report"
    pdf:
      - "打开 PDF 并检查版式、字段、金额、条款"
      - "V1 打印 -> 生成 V2 -> 再打印 V1，V1 与 V1 快照一致"
    browser:
      - "真实浏览器点击输出结算单"
      - "真实打开 PDF"
      - "检查版式与关键业务字段"
  business_review:
    - "业务负责人人工验收通过"

success_definition:
  - "Statement 可按要求输出 PDF"
  - "打印数据来源正确"
  - "版本独立"
  - "金额一致性校验有效"
  - "四状态均可打印"
  - "PDF 与原始单据版式一致"
  - "服务端 + PDF + 浏览器 + 业务验收全部通过"

deliverables:
  - "report/customer_statement_report.xml"
  - "Statement 表单 Print Statement 按钮"
  - "freight.statement.action_print_statement"
  - "forwarder_contact 字段"
  - "manifest / i18n / Context 审计"
  - "PDF 渲染与浏览器验收记录"

audit:
  intent_records: "执行完成后归档至 INT-FREIGHT-SPRINT4-6-001/"

risk_precheck:
  - "打印不创建/修改 account.move"
  - "打印不修改 freight.service / fee_state"
  - "版本独立：打印所选 Statement 版本"
  - "金额一致性：不一致停止打印"
  - "真实 PDF 视觉与浏览器验收"
