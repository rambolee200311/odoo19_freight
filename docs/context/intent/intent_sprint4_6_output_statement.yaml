# ==============================================================
# Intent: Sprint4-6 输出结算单（Customer Statement PDF/QWeb Output）
# 状态：已确认（B-76 ~ B-80 + 独立评审修订 V1.1，可进入编码）
# 核心定位：
#   - 以 docs/reports/应收对账单原始单据.md 为版式输入（B-27 / BR-27）
#   - freight.statement 为输出主对象，数据来源为 Statement / Statement Line 快照
#   - 版本独立：每个 Statement 版本按自身快照打印，不默认取 current version
#   - 本 Sprint 只做 PDF 输出，不实现邮件、portal、条款字段化等扩展
# ==============================================================

intent_id: "INT-FREIGHT-SPRINT4-6-001"
sprint_version: "Sprint4-6-Output-Statement"
intent_work_type: "Development"
intent_change_type: "New Feature"
title: "输出结算单（还原应收对账单 PDF/QWeb 版式）"
target_scope: >
  在 tk_freight 中新增 freight.statement 的 PDF/QWeb 报表输出，版式还原
  docs/reports/应收对账单原始单据.md 的应收对账单（出口货代费用确认单）。
  输出数据必须来自 freight.statement / freight.statement.line 快照及
  freight.shipment / company 档案，禁止从 freight.service 或 account.move 重算；
  支持按 Statement 版本独立打印，不修改结算单状态、费用状态或发票流程。

context_binding:
  bind_context_version: "0.1.91"
  asset_snapshot_profile: "development"

context_policy:
  bind_version_immutable: true
  post_execution_context_update_allowed: true
  resulting_context_version: "auto"

business_intent:
  source:
    type: "customer_demand"
    origin_team: "业务负责人（用户）"
    confirmation_ref: "docs/reports/应收对账单原始单据.md（B-27/BR-27）+ Sprint4-6 起草指令"
  related_sprint:
    - "INT-FREIGHT-SPRINT4-001"
    - "INT-FREIGHT-SPRINT4-5-001"
  related_decisions:
    - "B-23"
    - "B-27"
    - "B-31"
    - "B-37"
    - "B-38"
    - "B-46"
    - "B-70"
  confirmed_decisions:
    - id: "B-76"
      decision_ref: "用户 2026-08-14 Sprint4-6 开放项确认"
      decision_status: "CONFIRMED"
      statement: "输出结算单打印不分状态，draft / confirmed / draft_invoice / voided 均可输出"
      rule_refs: ["BR-76"]
    - id: "B-77"
      decision_ref: "用户 2026-08-14 Sprint4-6 开放项确认"
      decision_status: "CONFIRMED"
      statement: "费用明细首列“关联运输信息”默认取 statement.line.product_id.name"
      rule_refs: ["BR-77"]
    - id: "B-78"
      decision_ref: "用户 2026-08-14 Sprint4-6 开放项确认"
      decision_status: "CONFIRMED"
      statement: "不新增公司英文名称/传真字段，缺失时隐藏；freight.statement 新增 forwarder_contact 字段记录对接货代人员"
      rule_refs: ["BR-78"]
    - id: "B-79"
      decision_ref: "用户 2026-08-14 Sprint4-6 开放项确认"
      decision_status: "CONFIRMED"
      statement: "对公收款账户读取 statement.company_id.bank_ids，按币种分组展示"
      rule_refs: ["BR-79"]
    - id: "B-80"
      decision_ref: "用户 2026-08-14 Sprint4-6 开放项确认"
      decision_status: "CONFIRMED"
      statement: "多币种按币种分组显示原币小计，同时显示 RMB 总应收；跨币种按 amount_total_company 换算本币（人民币）后直接相加"
      rule_refs: ["BR-80"]
  draft_scope:
    - "新增 freight.statement QWeb PDF 报表（ir.actions.report，report_type=qweb-pdf）"
    - "报表版式以应收对账单原始单据.md 的标题、公司信息、客户信息、单据元数据、费用明细、汇总、收款账户、结算条款、签章区为必现内容"
    - "输出数据只读 Statement / Statement Line 快照，禁止从 freight.service 重算"
    - "每个 Statement 版本独立可打印，打印当前打开/选中的版本"
    - "报表入口为 Statement 表单 Print 按钮 + ir.actions.report 标准打印入口"
    - "公司英文名称/传真缺失时隐藏；freight.statement 新增可选 forwarder_contact 字段记录对接货代人员"
    - "对公收款账户读取 company_id.bank_ids；多币种按币种分组显示原币小计并汇总 RMB 总应收"
  unresolved_unknowns: []

unknown_policy:
  unresolved_unknowns_allowed: false
  newly_discovered_unknown_action: "stop_and_escalate"
  coding_gate: "Q-S4-6-01 ~ Q-S4-6-05 已确认（B-76 ~ B-80），可进入编码"

decision_gate:
  status: "satisfied"
  required_before_coding: []
  mapping:
    - "B-27 -> 版式输入已确认（无需重复确认）"
    - "Q-S4-6-01 -> B-76"
    - "Q-S4-6-02 -> B-77"
    - "Q-S4-6-03 -> B-78"
    - "Q-S4-6-04 -> B-79"
    - "Q-S4-6-05 -> B-80"

review_revision:
  reviewer: "independent review"
  result: "9/10，修改后可以进入编码"
  key_fixes:
    - "amount_contract：statement.amount_total 为展示权威，line 汇总仅验证；不一致 stop_and_report"
    - "data_source_contract：拆分 snapshot_sources 与 live_master_sources，bank_ids 明确为 Company Master Data"
    - "forwarder_contact 仅接入现有 FROZEN_HEADER_FIELDS，不改状态机"
    - "transport_mode_contract：按 freight_operation_id.transport 判断，禁止字段存在性猜测"
    - "source_priority：source_doc 为版式权威，source_pdf 为视觉参考"
    - "terms_block.text_policy：条款原文禁止改写"

report_identity:
  report_name: "tk_freight.customer_statement_report"
  report_xml_id: "tk_freight.freight_statement_report"
  report_model: "freight.statement"
  report_type: "qweb-pdf"
  paper: "A4 Portrait"
  document_title: "出口货代费用确认单（应收对账单）"
  source_doc: "docs/reports/应收对账单原始单据.md"
  source_pdf: "docs/reports/应收对账单.pdf"
  print_file_name: "'%s-对账单' % (object.name)"
  version_independent: true
  source_priority:
    layout_authority: "source_doc"
    visual_reference: "source_pdf"
    rule: "结构、文字、栏目定义以 source_doc 为准；source_pdf 仅用于视觉比对，冲突时以 source_doc 为准"
  layout_contract:
    paper: "A4 Portrait"
    horizontal_overflow: "forbidden"
    vertical_overflow: "natural_pagination"
    repeated_table_header: true

data_source_contract:
  authoritative_object: "freight.statement"
  snapshot_sources:
    - "freight.statement"
    - "freight.statement.line"
  live_master_sources:
    - "statement.company_id"
    - "statement.company_id.bank_ids"
    - "statement.company_id.logo"
    - "statement.company_id.phone"
    - "statement.company_id.email"
    - "statement.company_id.company_details"
    - "statement.company_id.report_header"
  source_classification_rule: "历史 Statement 的费用、客户、金额、运输信息来自自身快照；公司 Logo、联系方式、银行账户属于当前 Company Master Data，不属于 Statement 财务快照"
  forbidden_sources:
    - "从 freight.service 重算行、数量、单价、税额或金额"
    - "从 account.move / invoice_ids 重算对账单金额"
    - "打印时用 current version 覆盖用户所选 statement 版本"
    - "打印过程中 write / unlink statement、statement.line、freight.service、fee_state"
  snapshot_rule: "打印内容只读取所选 Statement 自身及其 line 快照；缺失字段按展示规则处理，不触发 recompute"

section_contract:
  company_header:
    required: true
    only_existing_fields: true
    fields:
      - label: "公司中文名称"
        source: "statement.company_id.name"
      - label: "Logo"
        source: "statement.company_id.logo"
      - label: "联系电话"
        source: "statement.company_id.phone"
      - label: "邮箱"
        source: "statement.company_id.email"
      - label: "可选补充信息"
        source: "statement.company_id.company_details / report_header"
    missing_policy: "缺失字段隐藏或留空，不阻断打印"
    decision_refs: ["B-78"]
    note: "company_details / report_header 使用 Odoo 现有 res.company 字段；不存在或为空时按 missing_policy 隐藏，不新增公司字段"
  customer_block:
    required: true
    fields:
      - label: "客户名称（付款方）"
        source: "statement.customer_id.name"
      - label: "对接货代人员"
        source: "statement.forwarder_contact"
    missing_policy: "customer_id 必填，缺失时打印前明确报错"
    decision_refs: ["B-78"]
  metadata_block:
    required: true
    document_type: "fixed：出口货代费用确认单（应收对账单）"
    transport_mode_source: "freight_operation_id.transport"
    transport_mode_rule: "必须使用正式业务字段 transport 选择字段组；禁止通过 vessel_id / airline_id / truck_ref 是否存在猜测运输模式"
    fields:
      - label: "制单日期"
        source: "statement.settlement_date"
        format: "YYYY-MM-DD"
      - label: "内部工作号"
        source: "freight_operation_id.name"
      - label: "船名航次"
        source: "ocean: vessel_id.name + ' / ' + voyage_no；air: airline_id.name + ' / ' + flight_no；land: truck_ref / trucker_number"
        fallback: "空值显示 '-'"
      - label: "提单号"
        source: "ocean: bl_number 优先，否则 obl；air: mawb_no；land: truck_ref"
        fallback: "空值显示 '-'"
      - label: "开航日期"
        source: "freight_operation_id.pickup_datetime 的日期"
        note: "当前字段语义为 Estimate Pickup；如需独立开航日期字段，后续 Sprint 评估，本 Sprint 使用现有字段"
        fallback: "空值隐藏或留空"
  line_table:
    required: true
    columns:
      - label: "关联运输信息"
        source: "statement.line.product_id.name"
        decision_refs: ["B-77"]
      - label: "费用名称"
        source: "statement.line.name"
      - label: "结算币种"
        source: "statement.line.currency_id"
      - label: "单价/数量"
        source: "statement.line.price_unit + ' / ' + statement.line.qty"
      - label: "应收金额(RMB)"
        source: "statement.line.amount_total_company"
    row_rule: "一条 statement.line 输出一行；不拆分、不合并、不重算"
    negative_rule: "负向费用以 -1,000.00 形式展示，禁止括号负数，不折行、不吞字符"
  summary_block:
    required: true
    fields:
      - label: "总应收金额"
        source: "RMB: statement.amount_total（展示权威）；多币种同时展示 statement.currency_summary"
      - label: "币种汇总"
        source: "按 statement.line.currency_id 分组展示原币小计；RMB 总应收 = sum(amount_total_company)，跨币种换算本币（人民币）后直接相加"
    decision_refs: ["B-80"]
  bank_account_block:
    required: false
    source: "statement.company_id.bank_ids"
    grouping: "按 currency_id 分组"
    display: "开户行 bank_id.name；账号 acc_number；账户持有人 acc_holder_name"
    missing_policy: "无账户时整区隐藏或留空，不阻断打印"
    decision_refs: ["B-79"]
    note: "bank_ids 属于 Company Master Data（live master source），不是 Statement 快照；历史 Statement 重打可能展示当前公司账户"
  terms_block:
    required: true
    mode: "template_static"
    source_text: "docs/reports/应收对账单原始单据.md 第四节 1-5"
    text_policy:
      source: "docs/reports/应收对账单原始单据.md"
      modification: "forbidden"
      rule: "条款文本不得润色、改写、翻译、纠错或自行补充"
    rendering:
      - "货物履约确认条款原样呈现"
      - "账期约定：船舶开航后 5 个工作日内结清"
      - "逾期按每日千分之三计收违约金"
      - "单据留置权约定"
      - "客户盖章与年月日签章区"
    note: "条款字段化/存档不纳入本 Sprint"

amount_contract:
  statement_rmb_total:
    source: "statement.amount_total"
    display_authority: true
  line_rmb_amount:
    source: "statement.line.amount_total_company"
    display_authority: true
  consistency_check: true
  inconsistency_action: "stop_and_report"
  report_must_not_recalculate: true
  rules:
    - "statement.amount_total 必须等于 sum(statement.line.amount_total_company)"
    - "报表只展示 statement 快照金额，不在 QWeb 内重算汇率或金额"
    - "不一致属于数据完整性异常，打印前明确报错/停止，不得自行修正"
    - "负费用格式为 -1,000.00，禁止括号负数"
  original_currency_total: "statement.line.amount_total 按 currency_id 分组小计"
  conversion: "不重算汇率；直接使用 statement.line 快照中的 settlement_rate 与 amount_total_company"
  grouping: "按 currency_id 分组展示原币小计；RMB 总应收按 amount_total_company 汇总后直接相加"

bank_account_contract:
  source: "statement.company_id.bank_ids"
  filter: "active 银行账户"
  grouping: "按 currency_id 分组"
  display_fields:
    - "bank_id.name"
    - "acc_number"
    - "acc_holder_name"
  missing_policy: "无账户时隐藏或留空，不阻断打印"
  forbidden: "本 Sprint 不新增 statement/客户级账户绑定字段"
  note: "bank_ids 属于 Company Master Data，不是 Statement 快照；历史 Statement 重打可展示当前公司账户"

transport_mode_contract:
  mode_field: "freight_operation_id.transport"
  mode_values: ["air", "ocean", "land"]
  mapping:
    ocean:
      - "vessel_id.name + ' / ' + voyage_no"
      - "bl_number 优先，否则 obl"
    air:
      - "airline_id.name + ' / ' + flight_no"
      - "mawb_no"
    land:
      - "truck_ref / trucker_number"
      - "truck_ref"
  forbidden:
    - "不得通过 vessel_id / airline_id / truck_ref 是否有值推断 transport"
    - "不得在 QWeb 中自行判断业务场景，必须读取 freight_operation_id.transport"

field_freeze_contract:
  forwarder_contact:
    field_scope: "仅新增 forwarder_contact 字段并登记到现有 FROZEN_HEADER_FIELDS"
    freeze_timing: "draft 可编辑；voided / confirmed / draft_invoice 只读"
    printing_side_effect: "打印只读取字段，不触发冻结或写回"
    forbidden:
      - "不得修改现有 Statement 状态机"
      - "不得扩大其他既有冻结字段语义"
      - "不得在打印时写 statement / statement.line / fee_state"

company_master_field_contract:
  use_only_existing_fields: true
  fields:
    - "statement.company_id.name"
    - "statement.company_id.logo"
    - "statement.company_id.phone"
    - "statement.company_id.email"
    - "statement.company_id.company_details"
    - "statement.company_id.report_header"
  missing_policy: "字段不存在或为空时隐藏，不新增公司字段"

version_preservation_contract:
  rule: "每次打印必须使用所选 statement 自身的 header 与 statement.line 快照"
  acceptance_scenario:
    - "打印 Statement V1"
    - "生成/修改 Statement V2"
    - "再次打印 Statement V1"
    - "V1 PDF 内容必须与 V1 自身快照一致"
  forbidden:
    - "不得用 current version 覆盖历史版本"
    - "不得在 V2 生成后回写 V1 快照"

architecture_simplification:
  implementation_shape: "freight.statement -> QWeb -> PDF"
  python_changes_only:
    - "forwarder_contact 字段"
    - "action_print_statement 打印动作"
  excluded_designs:
    - "Report Wizard"
    - "Report 参数模型"
    - "Snapshot Report Model"
    - "Report Service"
    - "Python PDF 生成器"
    - "独立银行账户快照模型"
    - "Invoice 数据同步"
    - "邮件发送 / Portal / 动态条款模型"

print_entry_contract:
  canonical_entry: "action_print_statement"
  form_button:
    label: "输出结算单"
    method: "freight.statement.action_print_statement"
    state_visible: ["draft", "confirmed", "draft_invoice", "voided"]
  report_binding: "ir.actions.report 仅作为 action_print_statement 触发的渲染动作，不提供绕过校验的独立打印入口"
  voided_policy: "允许输出；打印不分状态"
  direct_call: "action_print_statement 不按 state 拦截，任何状态均可返回报表；标准打印入口必须先执行 amount 一致性校验"

state_ui_contract:
  draft:
    print_button: true
    report_action: true
  confirmed:
    print_button: true
    report_action: true
  draft_invoice:
    print_button: true
    report_action: true
  voided:
    print_button: true
    report_action: true

scope:
  allowed_files:
    - "docs/context/intent/intent_sprint4_6_output_statement.yaml"
    - "mymodules/tk_freight/models/freight_statement.py"
    - "mymodules/tk_freight/views/freight_statement_view.xml"
    - "mymodules/tk_freight/__manifest__.py"
    - "mymodules/tk_freight/report/customer_statement_report.xml"
    - "mymodules/tk_freight/i18n/zh_CN.po"
    - "docs/context/business/business_rules.yaml"
    - "docs/context/history/decision_note.md"
    - "docs/context/history/sprint_log.md"
    - "docs/context/context_version.yaml"
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-6-001/"
    - "docs/context/validation/test_exec_records.yaml"
  forbidden_paths:
    - "odoo/"
    - "addons/"
    - "mymodules/tk_freight/wizard/"
    - "mymodules/tk_freight/security/"
    - "mymodules/tk_freight/data/"
    - "mymodules/tk_freight/controllers/"
    - "mymodules/tk_freight/static/"
    - "mymodules/tk_freight/models/freight_shipment.py"
    - "mymodules/tk_freight/models/freight_configuration.py"
    - "mymodules/tk_freight/views/menus.xml"
  allowed_changes:
    - "新增 report/customer_statement_report.xml（QWeb 模板 + ir.actions.report）"
    - "manifest 仅注册新增 report XML"
    - "freight_statement.py 新增 forwarder_contact 字段、action_print_statement 打印动作及冻结字段登记"
    - "freight_statement_view.xml 新增输出结算单按钮与 forwarder_contact 展示"
    - "zh_CN.po 新增报表/按钮/栏目中文文案"
    - "business_rules.yaml 登记 BR-76 ~ BR-80"
    - "Context 审计记录更新（decision_note / sprint_log / context_version）"
  forbidden_changes:
    - "修改 account 模块或官方 addons"
    - "修改结算单状态机、版本链、作废/确认/草稿发票逻辑"
    - "修改 freight.service / fee_state / wizard / shipment 业务逻辑"
    - "修改菜单、权限、security group / record rule"
    - "新建 data XML 或修改 data/ 目录"
    - "新增邮件模板、portal 页面、Controller 或前端静态资源"
    - "使用 reportlab / 直连 SQL / 非 QWeb 报表机制"
    - "打印时写回任何业务数据"

change_boundary:
  functional_code:
    - "mymodules/tk_freight/report/customer_statement_report.xml"
    - "mymodules/tk_freight/models/freight_statement.py"
    - "mymodules/tk_freight/views/freight_statement_view.xml"
    - "mymodules/tk_freight/__manifest__.py"
  translation:
    - "mymodules/tk_freight/i18n/zh_CN.po"
  context_audit:
    - "docs/context/history/decision_note.md"
    - "docs/context/history/sprint_log.md"
    - "docs/context/context_version.yaml"
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-6-001/"
    - "docs/context/validation/test_exec_records.yaml"

technical_constraints:
  - "报表使用 Odoo QWeb PDF（ir.actions.report），模型为 freight.statement"
  - "A4 Portrait；禁止横向溢出，允许纵向自然分页，多页时费用明细表头重复"
  - "金额右对齐，数量/单价保留原字段精度，负费用显示 -1,000.00，禁止括号负数"
  - "中文文本采用项目现有报表中文渲染链路，验收 PDF 时检查字体与乱码"
  - "新增报表文件后在 manifest data 注册，不修改既有报表文件"
