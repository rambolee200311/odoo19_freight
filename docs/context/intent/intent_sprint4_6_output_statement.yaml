# ==============================================================
# Intent: Sprint4-6 输出结算单（Customer Statement PDF/QWeb Output）
# 状态：起草（待契约评审；draft_open_questions 待业务负责人确认）
# 核心定位：
#   - 以 docs/reports/应收对账单原始单据.md 为版式输入（B-27 / BR-27）
#   - freight.statement 为输出主对象，数据来源为 Statement / Statement Line 快照
#   - 版本独立：每个 Statement 版本按自身快照打印，不默认取 current version
#   - 本 Sprint 只做 PDF 输出，不实现邮件、portal、条款字段化等扩展
# ==============================================================

intent_id: "INT-FREIGHT-SPRINT4-6-001"
sprint_version: "Sprint4-6-Output-Statement"
intent_work_type: "Development"
intent_change_type: "New Feature"
title: "输出结算单（还原应收对账单 PDF/QWeb 版式）"
target_scope: >
  在 tk_freight 中新增 freight.statement 的 PDF/QWeb 报表输出，版式还原
  docs/reports/应收对账单原始单据.md 的应收对账单（出口货代费用确认单）。
  输出数据必须来自 freight.statement / freight.statement.line 快照及
  freight.shipment / company 档案，禁止从 freight.service 或 account.move 重算；
  支持按 Statement 版本独立打印，不修改结算单状态、费用状态或发票流程。

context_binding:
  bind_context_version: "0.1.89"
  asset_snapshot_profile: "development"

context_policy:
  bind_version_immutable: true
  post_execution_context_update_allowed: true
  resulting_context_version: "auto"

business_intent:
  source:
    type: "customer_demand"
    origin_team: "业务负责人（用户）"
    confirmation_ref: "docs/reports/应收对账单原始单据.md（B-27/BR-27）+ Sprint4-6 起草指令"
  related_sprint:
    - "INT-FREIGHT-SPRINT4-001"
    - "INT-FREIGHT-SPRINT4-5-001"
  related_decisions:
    - "B-23"
    - "B-27"
    - "B-31"
    - "B-37"
    - "B-38"
    - "B-46"
    - "B-70"
  confirmed_decisions: []
  draft_scope:
    - "新增 freight.statement QWeb PDF 报表（ir.actions.report，report_type=qweb-pdf）"
    - "报表版式以应收对账单原始单据.md 的标题、公司信息、客户信息、单据元数据、费用明细、汇总、收款账户、结算条款、签章区为必现内容"
    - "输出数据只读 Statement / Statement Line 快照，禁止从 freight.service 重算"
    - "每个 Statement 版本独立可打印，打印当前打开/选中的版本"
    - "报表入口为 Statement 表单 Print 按钮 + ir.actions.report 标准打印入口"
    - "缺失的可选档案信息（传真、英文公司名、银行账户等）按开放项确认后处理；默认隐藏或留空，不阻断打印"
  draft_open_questions:
    - id: "Q-S4-6-01"
      status: "DRAFT"
      decision_needed: true
      question: "哪些 Statement 状态允许输出结算单？"
      proposed_default: "draft / confirmed / draft_invoice 允许输出；voided 禁止输出"
      impact: "决定按钮可见性与 action_print_statement 方法级状态拦截"
    - id: "Q-S4-6-02"
      status: "DRAFT"
      decision_needed: true
      question: "费用明细首列“关联运输信息”当前无独立字段，取哪个来源？"
      proposed_default: "statement.line.name 优先，其次 statement.line.product_id.name；无值显示 '-'"
      impact: "决定是否需要在 statement.line 增加关联运输信息快照字段或保持现有字段直出"
    - id: "Q-S4-6-03"
      status: "DRAFT"
      decision_needed: true
      question: "公司英文名称、传真及“对接货代人员”是否纳入本 Sprint 字段扩展？"
      proposed_default: "英文名称/传真不新增字段，缺失时隐藏；对接货代人员取 freight_operation_id.operator_id（公司名 + 姓名）"
      impact: "决定是否允许修改 res.company / res.partner 继承或 statement 新增字段"
    - id: "Q-S4-6-04"
      status: "DRAFT"
      decision_needed: true
      question: "对公收款账户是否直接读取公司档案 bank_ids 按币种展示？"
      proposed_default: "读取 statement.company_id.bank_ids，按 currency_id 分组展示开户行/账号；无账户时隐藏"
      impact: "决定是否新增 statement/客户级账户绑定字段"
    - id: "Q-S4-6-05"
      status: "DRAFT"
      decision_needed: true
      question: "多币种结算单在 PDF 中的汇总口径？"
      proposed_default: "按 currency_id 分别显示原币小计，同时显示 RMB 总应收（amount_total_company 汇总）；禁止跨币种直接相加"
      impact: "决定表格与汇总区的展示结构"
  unresolved_unknowns: []

unknown_policy:
  unresolved_unknowns_allowed: true
  newly_discovered_unknown_action: "stop_and_escalate"
  coding_gate: "draft_open_questions 全部确认前不进入编码；当前 unresolved_unknowns 为空仅用于满足门禁扫描"

decision_gate:
  status: "pending_review"
  required_before_coding:
    - "Q-S4-6-01 打印状态确认"
    - "Q-S4-6-02 关联运输信息来源确认"
    - "Q-S4-6-03 公司/人员字段范围确认"
    - "Q-S4-6-04 收款账户来源确认"
    - "Q-S4-6-05 多币种汇总口径确认"
  mapping:
    - "B-27 -> 版式输入已确认（无需重复确认）"
    - "Q-S4-6-01 ~ Q-S4-6-05 -> 待业务负责人确认后转 B-* 决策"

report_identity:
  report_name: "tk_freight.customer_statement_report"
  report_xml_id: "tk_freight.freight_statement_report"
  report_model: "freight.statement"
  report_type: "qweb-pdf"
  paper: "A4 Portrait"
  document_title: "出口货代费用确认单（应收对账单）"
  source_doc: "docs/reports/应收对账单原始单据.md"
  source_pdf: "docs/reports/应收对账单.pdf"
  print_file_name: "'%s-对账单' % (object.name)"
  version_independent: true

data_source_contract:
  authoritative_object: "freight.statement"
  header_source: "freight.statement + freight_operation_id + company_id"
  line_source: "freight.statement.line 快照"
  forbidden_sources:
    - "从 freight.service 重算行、数量、单价、税额或金额"
    - "从 account.move / invoice_ids 重算对账单金额"
    - "打印时用 current version 覆盖用户所选 statement 版本"
    - "打印过程中 write / unlink statement、statement.line、freight.service、fee_state"
  snapshot_rule: "打印内容只读取所选 Statement 自身及其 line 快照；缺失字段按展示规则处理，不触发 recompute"

section_contract:
  company_header:
    required: true
    fields:
      - label: "公司中文名称"
        source: "statement.company_id.name"
      - label: "Logo"
        source: "statement.company_id.logo"
      - label: "联系电话"
        source: "statement.company_id.phone"
      - label: "邮箱"
        source: "statement.company_id.email"
      - label: "可选补充信息"
        source: "statement.company_id.company_details / report_header"
    missing_policy: "缺失字段隐藏或留空，不阻断打印"
    open_questions: ["Q-S4-6-03"]
  customer_block:
    required: true
    fields:
      - label: "客户名称（付款方）"
        source: "statement.customer_id.name"
      - label: "对接货代人员"
        source: "freight_operation_id.operator_id（公司名 + 姓名）"
    missing_policy: "customer_id 必填，缺失时打印前明确报错"
    open_questions: ["Q-S4-6-03"]
  metadata_block:
    required: true
    document_type: "fixed：出口货代费用确认单（应收对账单）"
    fields:
      - label: "制单日期"
        source: "statement.settlement_date"
        format: "YYYY-MM-DD"
      - label: "内部工作号"
        source: "freight_operation_id.name"
      - label: "船名航次"
        source: "ocean: vessel_id.name + ' / ' + voyage_no；air: airline_id.name + ' / ' + flight_no；land: truck_ref / trucker_number"
        fallback: "空值显示 '-'"
      - label: "提单号"
        source: "ocean: bl_number 优先，否则 obl；air: mawb_no；land: truck_ref"
        fallback: "空值显示 '-'"
      - label: "开航日期"
        source: "freight_operation_id.pickup_datetime 的日期"
        note: "当前字段语义为 Estimate Pickup；如需独立开航日期字段，作为开放项处理"
        fallback: "空值隐藏或留空"
  line_table:
    required: true
    columns:
      - label: "关联运输信息"
        source: "statement.line.name 优先，其次 statement.line.product_id.name"
        open_questions: ["Q-S4-6-02"]
      - label: "费用名称"
        source: "statement.line.name"
      - label: "结算币种"
        source: "statement.line.currency_id"
      - label: "单价/数量"
        source: "statement.line.price_unit + ' / ' + statement.line.qty"
      - label: "应收金额(RMB)"
        source: "statement.line.amount_total_company"
    row_rule: "一条 statement.line 输出一行；不拆分、不合并、不重算"
    negative_rule: "负向费用以负号展示，不折行、不吞字符"
  summary_block:
    required: true
    fields:
      - label: "总应收金额"
        source: "RMB: statement.amount_total；多币种同时展示 statement.currency_summary"
      - label: "币种汇总"
        source: "按 statement.line.currency_id 分组展示原币小计，RMB 汇总为 amount_total_company 之和"
    open_questions: ["Q-S4-6-05"]
  bank_account_block:
    required: false
    source: "statement.company_id.bank_ids"
    grouping: "按 currency_id 分组"
    display: "开户行 bank_id.name；账号 acc_number；账户持有人 acc_holder_name"
    missing_policy: "无账户时整区隐藏或留空，不阻断打印"
    open_questions: ["Q-S4-6-04"]
  terms_block:
    required: true
    mode: "template_static"
    source_text: "docs/reports/应收对账单原始单据.md 第四节 1-5"
    rendering:
      - "货物履约确认条款原样呈现"
      - "账期约定：船舶开航后 5 个工作日内结清"
      - "逾期按每日千分之三计收违约金"
      - "单据留置权约定"
      - "客户盖章与年月日签章区"
    note: "条款字段化/存档不纳入本 Sprint，除非 Q-S4-6-03 或新增开放项确认"

amount_contract:
  line_rmb_amount: "statement.line.amount_total_company（含税金额 x settlement_rate）"
  rmb_total: "statement.amount_total = sum(statement.line.amount_total_company)"
  original_currency_total: "statement.line.amount_total 按 currency_id 分组小计"
  conversion: "不重算汇率；直接使用 statement.line 快照中的 settlement_rate 与 amount_total_company"
  grouping: "按 currency_id 分组展示，禁止跨币种相加"

bank_account_contract:
  source: "statement.company_id.bank_ids"
  filter: "active 银行账户"
  grouping: "按 currency_id 分组"
  display_fields:
    - "bank_id.name"
    - "acc_number"
    - "acc_holder_name"
  missing_policy: "无账户时隐藏或留空，不阻断打印"
  forbidden: "本 Sprint 默认不新增 statement/客户级账户绑定字段"

print_entry_contract:
  form_button:
    label: "输出结算单"
    method: "freight.statement.action_print_statement"
    state_visible: ["draft", "confirmed", "draft_invoice"]
  report_binding: "ir.actions.report binding_type=report 提供标准打印入口"
  voided_policy: "默认禁止输出；如需 VOID 历史副本，由 Q-S4-6-01 确认"
  direct_call: "action_print_statement 对 voided 拒绝并给出明确错误"

state_ui_contract:
  draft:
    print_button: true
    report_action: true
  confirmed:
    print_button: true
    report_action: true
  draft_invoice:
    print_button: true
    report_action: true
  voided:
    print_button: false
    report_action: false

scope:
  allowed_files:
    - "docs/context/intent/intent_sprint4_6_output_statement.yaml"
    - "mymodules/tk_freight/models/freight_statement.py"
    - "mymodules/tk_freight/views/freight_statement_view.xml"
    - "mymodules/tk_freight/__manifest__.py"
    - "mymodules/tk_freight/report/customer_statement_report.xml"
    - "mymodules/tk_freight/i18n/zh_CN.po"
    - "docs/context/history/decision_note.md"
    - "docs/context/history/sprint_log.md"
    - "docs/context/context_version.yaml"
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-6-001/"
    - "docs/context/validation/test_exec_records.yaml"
  forbidden_paths:
    - "odoo/"
    - "addons/"
    - "mymodules/tk_freight/wizard/"
    - "mymodules/tk_freight/security/"
    - "mymodules/tk_freight/data/"
    - "mymodules/tk_freight/controllers/"
    - "mymodules/tk_freight/static/"
    - "mymodules/tk_freight/models/freight_shipment.py"
    - "mymodules/tk_freight/models/freight_configuration.py"
    - "mymodules/tk_freight/views/menus.xml"
    - "docs/context/business/business_rules.yaml"
  allowed_changes:
    - "新增 report/customer_statement_report.xml（QWeb 模板 + ir.actions.report）"
    - "manifest 仅注册新增 report XML"
    - "freight_statement.py 仅新增 action_print_statement 打印动作（如需）"
    - "freight_statement_view.xml 仅新增输出结算单按钮"
    - "zh_CN.po 新增报表/按钮/栏目中文文案"
    - "Context 审计记录更新（decision_note / sprint_log / context_version）"
  forbidden_changes:
    - "修改 account 模块或官方 addons"
    - "修改结算单状态机、版本链、作废/确认/草稿发票逻辑"
    - "修改 freight.service / fee_state / wizard / shipment 业务逻辑"
    - "修改菜单、权限、security group / record rule"
    - "新建 data XML 或修改 data/ 目录"
    - "新增邮件模板、portal 页面、Controller 或前端静态资源"
    - "使用 reportlab / 直连 SQL / 非 QWeb 报表机制"
    - "打印时写回任何业务数据"

change_boundary:
  functional_code:
    - "mymodules/tk_freight/report/customer_statement_report.xml"
    - "mymodules/tk_freight/models/freight_statement.py"
    - "mymodules/tk_freight/views/freight_statement_view.xml"
    - "mymodules/tk_freight/__manifest__.py"
  translation:
    - "mymodules/tk_freight/i18n/zh_CN.po"
  context_audit:
    - "docs/context/history/decision_note.md"
    - "docs/context/history/sprint_log.md"
    - "docs/context/context_version.yaml"
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-6-001/"
    - "docs/context/validation/test_exec_records.yaml"

technical_constraints:
  - "报表使用 Odoo QWeb PDF（ir.actions.report），模型为 freight.statement"
  - "A4 纵向，页面内容不溢出；多页时费用明细表头重复"
  - "金额右对齐，数量/单价保留原字段精度，负费用显示负号"
  - "中文文本采用项目现有报表中文渲染链路，验收 PDF 时检查字体与乱码"
  - "新增报表文件后在 manifest data 注册，不修改既有报表文件"
  - "action_print_statement 仅返回 report_action，不允许创建/修改任何记录"
  - "voided 状态默认拦截；draft/confirmed/draft_invoice 允许输出"
  - "多币种汇总按 currency_id 分组，禁止直接相加不同币种"
  - "报表字段直接引用 statement / statement.line 快照，禁止反向读取 freight.service 计算"
  - "打印所选 statement 记录自身，禁止跳转到 current version"

invariants:
  unchanged_business_behavior:
    - "statement 状态机与版本链不变"
    - "fee_state 语义与费用锁定不变"
    - "草稿发票生成、幂等、税映射逻辑不变"
    - "BR-23 / BR-27 / BR-35 / BR-38 / BR-70 口径不变"
  unchanged_permissions:
    - "不修改既有 security group / record rule"
  forbidden_menu_changes: []

acceptance_criteria:
  functional:
    - "Statement 表单存在“输出结算单”按钮，draft / confirmed / draft_invoice 可见，voided 不可见"
    - "输出 PDF 标题为“出口货代费用确认单（应收对账单）”"
    - "公司名称/电话/邮箱/Logo、客户名称、对接货代人员、单据元数据按 section_contract 展示"
    - "费用明细表逐行输出 statement.line 快照，不拆分、不合并、不重算"
    - "总应收金额与 statement.amount_total 一致"
    - "对公收款账户按币种分组展示（有数据时）"
    - "结算条款与客户盖章/年月日签章区原样呈现"
    - "voided Statement 直接调用 action_print_statement 被拒绝"
    - "打印所选版本，不使用 current version 覆盖"
    - "打印过程不写 statement / statement.line / freight.service / fee_state"
  excluded:
    - "邮件发送对账单"
    - "portal 客户自助查看/下载"
    - "条款字段化/客户条款存档"
    - "账户信息档案扩展（默认不新增字段）"
    - "PDF 水印/审批签章"
    - "Excel/CSV 输出"
  non_regression:
    - "既有报表、菜单、权限、wizard、invoice 流程不受影响"
    - "结算单状态机与版本链不变"
    - "BR-27 版式输入不变"
  validation:
    - "context_loader.py 基线 PASS（bind 0.1.89）"
    - "verify.py 全部强制门禁 PASS（18 项）"
    - "XML-RPC 模块升级验证通过"
    - "PDF 渲染验收：A4、中文、表格、负数、多币种、分页表头"
    - "浏览器验收：draft/confirmed/draft_invoice 打印、voided 拦截、历史版本独立打印"

validation:
  context:
    required_version: "0.1.89"
    command: "context_loader.py"
    expected: "PASS"
    bind_version_must_match: true
  static:
    - "verify.py 全部强制门禁 PASS"
  build:
    - "Python/XML/Odoo19 兼容校验 PASS"
  runtime:
    server_side:
      - "常驻 Odoo + button_immediate_upgrade 通过"
      - "odoo shell 断言：report 存在、模型正确、action_print_statement 状态拦截、打印不写业务数据"
    pdf:
      - "生成真实 PDF 并渲染检查：标题、公司信息、客户、单据元数据、费用表、汇总、账户、条款、签章区"
      - "中文不乱码、表格边框完整、多页表头重复、负数/多币种无溢出"
    browser:
      - "Statement 表单点击输出结算单，PDF 可打开"
      - "voided 状态无按钮"
      - "历史版本打开后打印的是该版本内容"
  business_review:
    - "业务负责人人工验收通过"
  snapshot:
    verify_gate_count: 18
    note: "verify.py 18 项门禁为当前基线"

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  scope_expansion:
    allowed: false
    require_human: true
  stop_condition:
    success:
      - all_validation_pass
      - human_accept
    hard_stop:
      - risk_block
      - scope_violation
      - forbidden_change
      - new_unknown

affected_assets:
  business:
    - business_rules
  architecture: []
  governance: []
  history:
    - decision_note
    - sprint_log

execution_artifacts:
  intent_records:
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-6-001/"
  validation_records:
    - "docs/context/validation/test_exec_records.yaml"
  context_version:
    - "docs/context/context_version.yaml"

success_definition:
  - "freight.statement 可输出 PDF 结算单，版式还原应收对账单原始单据"
