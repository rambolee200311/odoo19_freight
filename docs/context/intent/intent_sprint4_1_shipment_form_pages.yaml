intent_id: "INT-FREIGHT-SPRINT4-1-001"
sprint_version: "Sprint4-1-Shipment-Form-Pages"
intent_work_type: "Development"
intent_change_type: "View Enhancement"
title: "freight.shipment 表单新增对账单（Statement）与发票（Invoice）两个 Page"
target_scope: "仅在 freight.shipment 表单 notebook 内新增两个展示页：对账单页展示该货运单的全部结算单版本；发票页展示该货运单关联的应收/应付发票。不做状态机、开票逻辑、菜单或权限改动"

context_binding:
  bind_context_version: "0.1.44"
  asset_snapshot_profile: "development"

context_policy:
  bind_version_immutable: true
  post_execution_context_update_allowed: true
  resulting_context_version: "auto"

business_intent:
  source:
    type: "customer_demand"
    origin_team: "业务负责人（用户）"
    confirmation_ref: "Sprint4-1 起草"
  related_sprint:
    - "INT-FREIGHT-SPRINT4-001"
  confirmed_decisions: []
  draft_scope:
    - "对账单 Page：展示 freight.shipment.statement_ids（含 voided / confirmed / draft_invoice 全版本）"
    - "发票 Page：展示 freight.shipment 关联 account.move（out_invoice / in_invoice，freight_operation_id 有值）"
    - "两页均为只读展示 + 行跳转打开明细，不直接在页面内新增/修改业务数据"
  unresolved_unknowns: ["U-33", "U-34", "U-35", "U-36"]
  draft_open_questions:
    - id: "U-33"
      statement: "两个 Page 在表单 notebook 中的位置与顺序（默认建议：Accountancy 页之后，先对账单后发票）"
    - id: "U-34"
      statement: "对账单 Page 是否需要直接放置操作按钮（生成/作废/确认/生成草稿发票），默认仅查看跳转"
    - id: "U-35"
      statement: "发票 Page 是否拆分应收/应付两个子页，默认合并一页并按 move_type 列区分"
    - id: "U-36"
      statement: "发票 Page 是否展示全部状态（草稿/已过账/红字），默认全部展示并按状态列区分"

unknown_policy:
  unresolved_unknowns_allowed: true
  newly_discovered_unknown_action: "record_and_continue"
  coding_gate: "U-33 ~ U-36 确认前禁止修改业务代码（verify c18）"

