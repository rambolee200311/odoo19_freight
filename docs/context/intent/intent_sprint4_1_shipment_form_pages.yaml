business_flow:
  - "货运单表单打开 → 原有 notebook 页保持不变"
  - "新增 对账单 Page：查看该货运单全部结算单版本（含作废）"
  - "新增 发票 Page：查看该货运单关联应收/应付发票"
  - "行点击跳转对应结算单/发票表单，页面本身不写数据"

acceptance_criteria:
  functional:
    - "freight.shipment 表单 notebook 内存在 对账单 与 发票 两个 Page"
    - "对账单 Page 展示 freight.statement 全版本（draft/voided/confirmed/draft_invoice），含编号、客户、状态、版本、结算日期、合计金额"
    - "发票 Page 展示 freight_operation_id 关联的 out_invoice/in_invoice，含发票号、类型、客户、日期、状态、金额、来源结算单"
    - "行可跳转打开对应记录表单；页面无新建/删除按钮"
    - "既有 Pages/按钮/统计按钮行为不变"
  excluded:
    - "结算单状态机、生成向导、作废/确认/开票逻辑改动"
    - "发票创建/过账/幂等/追溯逻辑改动"
    - "菜单、权限、报表、Controller、前端静态资源改动"
  non_regression:
    - "BR-01 ~ BR-14 业务规则不变"
    - "freight.statement 既有视图与按钮不变"
    - "account.move 标准字段与菜单入口不受破坏"
    - "不产生重复发票"
  validation:
    - "context_loader.py 基线 PASS（bind 0.1.43）"
    - "verify.py 全部强制门禁 PASS（U-33 ~ U-36 确认后）"
    - "XML-RPC 模块升级验证通过"
    - "业务负责人人工验收通过"

validation:
  context:
    - "context_loader.py 基线 PASS"
  static:
    - "verify.py 全部强制门禁 PASS"
  build:
    - "Python/XML/Odoo19 兼容校验 PASS"
  runtime:
    - "常驻 Odoo + 模块升级验证通过（button_immediate_upgrade / odoo_check.py）"
    - "对账单/发票两 Page 与行跳转断言 PASS"
  business_review:
    - "业务负责人人工验收通过"

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  scope_expansion:
    allowed: false
    require_human: true
  stop_condition:
