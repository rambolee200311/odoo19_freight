# ==============================================================
# Intent: Sprint4-4-4 Create Statement Wizard 生命周期与状态所有权重构
# 状态：已确认（U-45 → B-69；V2.0 生命周期契约实施完成）
# 目标：把 wizard 从“snapshot 数据驱动 + service_id 猜测恢复”的生命周期，
#       重构为“eligible service 驱动 + service_id 创建即绑定 + select 独立保存”
#       的单一生命周期；并强制 Phase 0 只读分析 / Phase 1 人审设计 /
#       Phase 4 Refactor Review 门禁，防止“打补丁冒充重构”。
# ==============================================================

intent_id: "INT-FREIGHT-SPRINT4-4-4-001"
sprint_version: "Sprint4-4-4-Wizard-Refactor"
intent_work_type: "Development"
intent_change_type: "Lifecycle Refactor"
title: "Create Statement Wizard 生命周期与状态所有权重构"
target_scope: >
  重构 freight.statement.wizard 的行集合构建、service_id 身份绑定、
  eligibility 计算、select 用户选择态以及生成前并发校验生命周期。
  将 Wizard 从“snapshot 数据驱动 + service_id 猜测恢复”的生命周期，
  重构为“eligible service 驱动 + service_id 创建即绑定 + select 独立保存”
  的单一生命周期。

core_refactor_goal:
  - "eligible 决定 Wizard 行集合"
  - "service_id 是 Wizard Line 的业务身份锚点"
  - "snapshot 字段只负责快照/展示，不参与 service_id 身份恢复"
  - "select 是用户选择状态，不等同于 eligible/selectable"
  - "rebuild 是显式生命周期事件，不允许被普通 write 隐式触发"
  - "generate 是最终一致性边界"

context_binding:
  bind_context_version: "0.1.75"
  asset_snapshot_profile: "development"

context_policy:
  bind_version_immutable: true
  post_execution_context_update_allowed: true
  resulting_context_version: "auto"

business_intent:
  source:
    type: "code_review_and_customer_demand"
    origin_team: "业务负责人（用户）+ 独立代码评审"
    confirmation_ref: "Sprint4-4-4 V2.0 生命周期契约重写"
  related_sprint:
    - "INT-FREIGHT-SPRINT4-4-2-001"
    - "INT-FREIGHT-SPRINT4-4-3-001"
  related_decisions:
    - "B-55"
    - "B-68"
    - "B-69"
  confirmed_decisions:
    - id: "B-61"
      decision_ref: "Sprint4-4-4 起草"
      decision_status: "CONFIRMED"
      statement: "wizard.line.service_id 必须从创建/eligible 重建时绑定真实 freight.service；禁止在业务层用 name+qty+price 猜测恢复 service_id，缺失关联时给出明确错误并要求重开向导"
    - id: "B-62"
      decision_ref: "Sprint4-4-4 起草"
      decision_status: "CONFIRMED"
      statement: "wizard 生命周期：行集合由 eligible 集合唯一驱动；initial_create/customer_change/eligible_rebuild 重建并绑定 service_id；ordinary_write 保留用户 select 且不重建"
    - id: "B-63"
      decision_ref: "Sprint4-4-4 起草"
      decision_status: "CONFIRMED"
      statement: "selectable 必须生效：action_generate_statement 对 selected 行校验 selectable，不可选行被勾选时明确报错，不得静默过滤"
    - id: "B-64"
      decision_ref: "Sprint4-4-4 起草"
      decision_status: "CONFIRMED"
      statement: "FOR UPDATE 行锁后必须全量重校验 eligible（fee_state、invoiced、非 voided Statement 占用、shipment/customer 归属），仅校验 fee_state 不充分"
    - id: "B-65"
      decision_ref: "Sprint4-4-4 起草"
      decision_status: "CONFIRMED"
      statement: "customer_id 必须是当前 shipment 的 shipper/consignee；domain 仅用于 UI 过滤，generate 必须服务端再次校验"
    - id: "B-66"
      decision_ref: "Sprint4-4-4 起草"
      decision_status: "CONFIRMED"
      statement: "eligibility 收口为单一 helper（_is_service_eligible），_compute_selectable 与 _eligible_services_for 均调用同一事实来源，消除两套规则漂移"
    - id: "B-67"
      decision_ref: "Sprint4-4-4 起草"
      decision_status: "CONFIRMED"
      statement: "wizard snapshot 语义统一：tax_amount/settlement_rate 在视图与模型两层只读；Statement Line sequence 按 10 步进且顺序稳定"
    - id: "B-68"
      decision_ref: "Sprint4-4-4 起草（对齐 Sprint4-4-2）"
      decision_status: "CONFIRMED"
      statement: "费用被 Statement 占用的唯一事实来源是 fee_state；statement_line_ids/statement.state 仅作为状态迁移触发与防御，不构成第二套占用引擎"
    - id: "B-69"
      decision_ref: "U-45"
      decision_status: "CONFIRMED"
      statement: "打开向导/客户切换/eligible 重建时，新建 eligible 行默认 select=True（B-69）；ordinary_write 保留用户 select"
  draft_scope:
    - "wizard 生命周期 before/after 定义"
    - "eligible/selectable/select 三态语义"
    - "service_id 身份锚点与 snapshot 职责分离"
    - "rebuild 矩阵与方法职责"
    - "Phase 0 只读分析 / Phase 1 人审设计 / Phase 4 Refactor Review"
  unresolved_unknowns: []
  confirmed_open_questions:
    - id: "U-45"
      status: "CONFIRMED"
      decision_ref: "B-69"
      statement: "打开向导时 eligible 费用行默认全部勾选（沿用 Sprint4-4-3），用户去勾不需要的费用"

unknown_policy:
  unresolved_unknowns_allowed: true
  newly_discovered_unknown_action: "stop_and_escalate"
  coding_gate: "U-45 → B-69 已确认（默认全选），无未决 UNKNOWN"

decision_gate:
  status: "satisfied"
  required_before_coding:
    - "Phase 0 只读分析完成"
    - "Phase 1 目标设计与方法职责经人工批准"
  mapping:
    - "U-45 -> B-69"

coding_gate:
  phase_0_readonly_analysis:
    required: true
    modification_allowed: false
    required_output:
      - "current wizard lifecycle"
      - "current service_id binding path"
      - "current select lifecycle"
      - "current eligibility paths"
      - "current selectable paths"
      - "current rebuild triggers"
      - "current service_id recovery logic"
      - "current generate validation path"
      - "current lock/revalidation path"
  phase_1_target_design:
    required: true
    human_approval_required: true
    required_output:
      - "before/after lifecycle"
      - "method responsibility matrix"
      - "rebuild matrix"
      - "eligible/selectable/select semantics"
      - "service_id identity contract"
      - "generate validation sequence"
  phase_2_coding:
    allowed_after_phase_1: true
  phase_3_validation:
    required:
      - "verify.py"
      - "context_loader.py"
      - "Odoo upgrade"
      - "wizard lifecycle tests"
      - "concurrency tests"
      - "browser validation"
  phase_4_refactor_review:
    required: true
    human_approval_required: true
    required_output:
      - "removed old mechanisms"
      - "new lifecycle mechanisms"
      - "method responsibility changes"
      - "before/after behavior"
      - "diff scope"

scope:
  allowed_files:
    - "docs/context/intent/intent_sprint4_4_4_wizard_refactor.yaml"
    - "docs/context/business/create_statement_wizar.md"
    - "docs/context/history/lessons_learned.md"
    - "docs/context/governance/test_lessons.yaml"
    - "docs/context/cognition/cognition_asset_map.md"
    - "docs/context/README.md"
    - "mymodules/tk_freight/wizard/freight_statement_wizard.py"
    - "mymodules/tk_freight/views/freight_statement_wizard_view.xml"
    - "mymodules/tk_freight/i18n/zh_CN.po"
    - "docs/context/business/knowledge_classification.md"
    - "docs/context/history/decision_note.md"
    - "docs/context/history/sprint_log.md"
    - "docs/context/context_version.yaml"
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-4-4-001/"
    - "docs/context/validation/test_exec_records.yaml"
  forbidden_paths:
    - "odoo/"
    - "addons/"
    - "mymodules/tk_freight/models/"
    - "mymodules/tk_freight/security/"
    - "mymodules/tk_freight/views/menus.xml"
    - "mymodules/tk_freight/__manifest__.py"
    - "docs/context/business/business_rules.yaml"
    - "mymodules/tk_freight/data/"
    - "mymodules/tk_freight/report/"
    - "mymodules/tk_freight/controllers/"
    - "mymodules/tk_freight/static/"
  allowed_changes:
    - "wizard 生命周期按 rebuild_matrix 重构"
    - "service_id 创建即绑定；移除 name+qty+price 猜测恢复"
    - "eligibility 单一 helper（wizard 文件内收口）"
    - "action_generate_statement 增加 selectable 校验与锁后全量 eligible 重校验"
    - "customer_id 服务端显式校验"
    - "tax_amount/settlement_rate readonly；sequence 按 sequence_policy"
    - "zh_CN.po 向导文案"
  forbidden_changes:
    - "修改 account 模块或官方 addons"
    - "修改费用状态机 / fee_state / Statement 状态机"
    - "修改 freight_statement.py / freight_statement.line 结构"
    - "修改菜单、权限、报表、PDF、Controller、前端静态资源"
    - "修改 business_rules.yaml 的占用事实来源口径"
    - "新建 data XML"
    - "采用 forbidden_implementation_patterns 中的任何模式"

change_boundary:
  functional_code:
    - "mymodules/tk_freight/wizard/freight_statement_wizard.py"
    - "mymodules/tk_freight/views/freight_statement_wizard_view.xml"
  translation:
    - "mymodules/tk_freight/i18n/zh_CN.po"
  context_audit:
    - "docs/context/business/knowledge_classification.md"
    - "docs/context/history/decision_note.md"
    - "docs/context/history/sprint_log.md"
    - "docs/context/context_version.yaml"
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-4-4-001/"
    - "docs/context/validation/test_exec_records.yaml"

business_flow:
  - "货单表单点击 Create Statement"
  - "initial_create：按 eligible 重建行集合，service_id 直接绑定，select 默认 True"
  - "用户选择客户（可选）：customer_change 按新 eligible 重建并重置 select"
  - "用户用原生 checkbox 勾选/去勾选费用行：ordinary_write 保留 select，不重建"
  - "点击 Generate Statement：生成前校验 + FOR UPDATE + 锁后全量重校验"
  - "创建 Statement Draft，费用写回 used"

wizard_lifecycle_contract:
  before:
    - "Wizard Line 的业务身份可能依赖 snapshot 字段"
    - "service_id 缺失时存在 name + qty + price 猜测恢复"
    - "eligible 与 selectable 存在独立计算路径"
    - "create/onchange/write 的行重建边界不清晰"
    - "普通 write 可能导致用户 select 状态被重建覆盖"
    - "生成时部分依赖 Wizard 当前 snapshot，而非稳定 service_id"
    - "锁后校验不足以覆盖完整 eligibility"
  after:
    - "eligible service 集合是 Wizard 行集合唯一来源"
    - "每一个 Wizard Line 创建时直接绑定真实 freight.service"
    - "service_id 缺失禁止猜测恢复"
    - "snapshot 字段不承担业务身份恢复职责"
    - "select 是独立的用户选择状态"
    - "普通 write 不触发行集合 rebuild"
    - "customer change 明确触发行集合 rebuild"
    - "rebuild 时按照契约初始化/重置 select"
    - "generate 前校验 selected 行 selectable"
    - "FOR UPDATE 后重新执行完整 eligibility 校验"
  initial_create:
    trigger: "wizard create"
    action:
      - "根据当前 customer/customer_domain 计算 eligible"
      - "line 集合必须等于 eligible"
      - "每行 service_id 直接绑定"
      - "select 默认 True（B-69）"
  ordinary_write:
    trigger: "仅修改 line.select 或其他普通 wizard 字段"
    action:
      - "不得重建 line 集合"
      - "不得重新计算 select"
      - "不得把 False 恢复为 True"
      - "不得重新绑定 service_id"
  customer_change:
    trigger: "customer_id 实际发生变化"
    action:
      - "重新计算 eligible"
      - "删除不再 eligible 的旧行"
      - "增加新 eligible 行"
      - "所有新建行 select=True"
      - "所有新建行直接绑定 service_id"
  eligible_rebuild:
    trigger: "明确要求重新构建 eligible 集合"
    action:
      - "重新计算 eligible"
      - "line 集合必须等于 eligible"
      - "新行 select=True"
      - "service_id 直接绑定"

wizard_line_semantics:
  eligible:
    definition: >
      当前 shipment + customer 条件下，该 freight.service 是否允许进入
      Wizard 候选集合。
    authority: "_is_service_eligible()"
    user_editable: false
  selectable:
    definition: >
      当前 Wizard 生命周期时点，该 Wizard Line 是否允许被用户选择/生成。
    authority: "_compute_selectable()"
    user_editable: false
  select:
    definition: >
      用户当前是否选择该费用行用于本次 Statement 生成。
    authority: "wizard.line.select"
    user_editable: true
  invariant:
    - "eligible != selectable"
    - "selectable != select"
    - "select=True 不代表最终一定可以生成"
    - "最终生成必须同时满足 select=True 且 selectable=True"

wizard_line_identity:
  identity_source:
    - "freight.service"
  binding_rule:
    - "Wizard Line 创建时必须直接写入 service_id"
    - "service_id 必须来自当前 eligible service 集合"
    - "禁止通过 snapshot 字段反向寻找 service"
  snapshot_rule:
    - "name"
    - "quantity"
    - "price"
    - "tax_amount"
    - "settlement_rate"
  snapshot_semantics:
    - "snapshot 用于展示和生成 Statement 时记录当时数据"
    - "snapshot 不承担 service 身份"
    - "snapshot 不得作为 service_id 恢复依据"
  forbidden_recovery:
    - "name + qty + price"
    - "name + quantity"
    - "name + price"
    - "任何 fuzzy matching"

rebuild_matrix:
  create:
    rebuild: true
    service_binding: "direct"
    select_policy: "all_true"
  customer_change:
    rebuild: true
    service_binding: "direct"
    select_policy: "reset_all_true"
  eligible_rebuild:
    rebuild: true
    service_binding: "direct"
    select_policy: "reset_all_true"
  ordinary_write:
    rebuild: false
    service_binding: "preserve"
    select_policy: "preserve"
  checkbox_change:
    rebuild: false
    service_binding: "preserve"
    select_policy: "user_defined"
  generate:
    rebuild: false
    service_binding: "preserve"
    select_policy: "preserve_then_validate"
  row_lock:
    rebuild: false
    service_binding: "preserve"
    select_policy: "preserve_then_revalidate"

method_responsibility:
  _is_service_eligible:
    responsibility:
      - "单个 freight.service 的 eligibility 判断"
    must_not:
      - "创建 wizard.line"
      - "修改 select"
  _eligible_services_for:
    responsibility:
      - "根据 shipment/customer 获取 eligible service 集合"
    must:
      - "调用 _is_service_eligible"
    must_not:
      - "直接决定用户 select"
  _rebuild_lines:
    responsibility:
      - "根据 eligible service 集合创建 Wizard Line"
      - "直接绑定 service_id"
      - "建立 snapshot"
    must_not:
      - "猜测 service_id"
      - "从 name/qty/price 恢复 service"
      - "被普通 write 隐式调用"
  _compute_selectable:
    responsibility:
      - "计算当前 Wizard Line 是否可选择"
    must:
      - "调用统一 eligibility helper"
    must_not:
      - "修改 select"
  create:
    responsibility:
      - "建立 Wizard 初始生命周期"
      - "触发首次 eligible rebuild"
      - "默认 select=True"
  onchange_customer:
    responsibility:
      - "customer 改变时 rebuild"
      - "重新绑定 service_id"
      - "按照 B-60/B-69 重置 select"
  write:
    responsibility:
      - "保存用户对 select 的修改"
    must_not:
      - "无条件 rebuild line"
      - "覆盖已有 select"
  action_generate_statement:
    responsibility:
      - "执行最终业务一致性检查"
      - "执行 customer invariant"
      - "执行 selectable 校验"
      - "执行 FOR UPDATE"
      - "执行锁后完整 eligibility 校验"

lifecycle_separation:
  - "create 不等同于 write"
  - "onchange 不等同于 generate"
  - "write 不得承担 rebuild 职责"
  - "generate 是最终事实校验边界"

selection_initialization:
  initial_open:
    eligible_lines: "select=True"
  customer_change:
    eligible_lines: "select=True"
  eligible_rebuild:
    eligible_lines: "select=True"
  ordinary_write:
    select: "preserve"
  user_uncheck:
    select: false
    must_not_rebuild: true

eligibility_model:
  base:
    function: "_is_service_eligible(service, customer)"
    must:
      - "service 属于当前 shipment"
      - "service.service_type in ('shipper','consignee')"
      - "service.fee_state == 'confirmed'"
      - "service.invoiced == False"
      - "service 无 active Statement 占用（非 voided statement.line 引用）"
      - "customer 为空或等于当前 shipment 的 shipper/consignee"
  wizard_eligible_set:
    function: "_eligible_services_for(customer)"
    source: "当前 shipment 的 freight.service"
    filter: "_is_service_eligible(service, customer)"
  ui_selectable:
    source_of_truth: "_is_service_eligible(service, current_customer)"
    note: "_compute_selectable 必须调用同一 helper，禁止第二套规则"

selection_contract:
  eligible:
    meaning: "当前允许进入 Statement 的费用服务集合"
  selectable:
    meaning: "当前服务是否仍允许用户选择"
    rule: "selectable == _is_service_eligible(service, current_customer)"
  selected:
    meaning: "用户当前勾选状态"
    rule:
      - "selected 不等于 eligible"
      - "selected 不等于 selectable"
      - "selected 仅表达用户选择意图"
  invariant: "selected ⊆ selectable ⊆ eligible"
  generate_precondition:
    - "selected 非空"
    - "selected ⊆ selectable"

customer_semantics:
  customer_id_false:
    meaning: "不指定客户"
    eligible_scope: "当前 shipment 的所有符合基础 eligibility 的费用"
    action: "不因空 customer_id 报错；生成时从 selected 推导唯一客户（沿用 B-60）"
  customer_id_set:
    must_be:
      - "shipment.shipper_id"
      - "shipment.consignee_id"
    violation: "ValidationError，禁止依赖‘查不到费用’间接兜底"

customer_invariant:
  allowed:
    - "shipment.shipper_id"
    - "shipment.consignee_id"
  forbidden:
    - "任意 customer"
    - "仅存在于 wizard snapshot 的 customer"
    - "仅通过 domain 过滤而不做服务端校验"
  validation:
    - "create/onchange 可以用于 UI 过滤"
    - "generate 必须服务端再次校验"

service_binding_contract:
  missing_service_id:
    recoverable:
      if: "该行只是客户端提交的 wizard 行，且可根据当前 authoritative eligible set 重新构建"
      then: "丢弃客户端行身份，按 eligible 重建；允许服务端重建，禁止客户端字段反向猜"
    unrecoverable:
      if: "无法从 authoritative source 得到对应 service"
      then: "ValidationError；禁止 name+qty+price 匹配"

line_collection_contract:
  user_delete:
    allowed: false
    behavior: "服务端恢复 authoritative eligible line set；用户只能通过 checkbox 表达 select"
  blank_line:
    behavior: "服务端按 eligible 重建并绑定 service_id；不得以空行参与 generate"

concurrency_contract:
  lock_target:
    - "最终准备写入 fee_state=used 的实际费用/service 行"
  lock_timing:
    - "Generate Statement 时"
    - "计算 selected 后"
    - "执行任何 used 写回之前"
  after_lock:
    - "重新读取当前数据库状态"
    - "重新执行 _is_service_eligible"
    - "重新验证 customer"
    - "重新验证 shipment"
    - "重新验证 invoiced"
    - "重新验证 active Statement occupancy"
    - "重新验证 fee_state"
  failure:
    - "任一 selected service 不再 eligible -> ValidationError"
    - "不得创建部分 Statement"
    - "不得部分写回 fee_state"

concurrency_invariant:
  rule: >
    FOR UPDATE 之前通过的 eligibility 结果不能视为最终事实。
  final_authority:
    - "锁后重新读取/验证数据库事实"
  forbidden:
    - "锁前结果直接用于最终创建"
    - "仅检查 fee_state"
    - "依赖 wizard snapshot 判断当前占用状态"

post_lock_validation:
  lock:
    source:
      - "selected freight.service"
  after_lock:
    rerun:
      - "fee_state"
      - "invoiced"
      - "active non-voided statement occupancy"
      - "shipment ownership"
      - "customer ownership"
      - "service eligibility"
  principle:
    - "lock 前检查用于用户反馈"
    - "lock 后检查用于最终业务一致性"
    - "两者不能互相替代"

lock_protocol:
  rule: "所有可能改变 fee_state 或 Statement occupancy 的写路径必须与 Generate Statement 使用同一费用行锁协议"
  statement: "本 Sprint 不修改这些写路径，但必须确认现有实现已遵守；确认方式：代码评审 + 并发 shell 断言"
  if_not_confirmed: "stop_and_escalate"

generate_transaction:
  atomic: true
  order:
    1: "validate wizard/customer"
    2: "resolve selected services"
    3: "lock selected fee rows"
    4: "re-read current state"
    5: "full eligibility validation"
    6: "create Statement Draft"
    7: "create Statement Lines"
    8: "update fee_state to used"
    9: "commit"
  failure:
    - "任何步骤失败 -> 整个 transaction rollback"
    - "不得产生半个 Statement"
    - "不得产生部分 fee_state=used"

generate_statement_contract:
  phase_1_wizard_validation:
    - "wizard shipment 必须存在"
    - "customer_id 必须为空、shipper 或 consignee"
    - "selected 必须至少一行"
    - "selected 行 service_id 必须非空"
    - "selected 行必须 selectable=True"
  phase_2_resolve:
    - "仅使用 wizard.line.service_id"
    - "禁止 name+qty+price 恢复"
    - "禁止从客户端字段猜测 service"
  phase_3_lock:
    - "对 selected service/fee authoritative rows FOR UPDATE"
    - "锁定顺序 deterministic"
  phase_4_revalidate:
    - "重新读取数据库状态"
    - "重新执行 _is_service_eligible"
    - "重新检查 fee_state / invoiced / active occupancy / shipment ownership / customer ownership"
  phase_5_create:
    - "创建 Statement Draft"
    - "按 deterministic order 创建 Statement Lines"
    - "sequence = 10,20,30..."
    - "写回 fee_state=used"
  phase_6_transaction:
    - "全过程 atomic"
    - "任一步骤失败全部 rollback"

generate_precheck:
  selected_lines:
    source: "wizard.line where select=True"
  reject_if:
    - "service_id is False"
    - "not selectable"
    - "service 不属于当前 shipment"
    - "customer 不属于 shipment shipper/consignee"
  error_requirement:
    - "错误必须明确指出是哪一行/哪项费用失效"
    - "不得静默过滤掉不可选行"

statement_creation_identity:
  source:
    - "wizard.line.service_id"
  forbidden_source:
    - "wizard.line.name"
    - "wizard.line.quantity"
    - "wizard.line.price"
    - "任何 snapshot 字段"
  invariant:
    - "Statement Line 必须能够追溯到原始 freight.service"

selection_empty:
  if: "selected lines == 0"
  action: "ValidationError"
  message: "至少选择一项费用后才能生成 Statement"

sequence_policy:
  start: 10
  increment: 10
  ordering_source:
    - "eligible service 的稳定顺序"
  invariant:
    - "同一批生成的 Statement Lines 顺序稳定"
    - "sequence 不参与 service identity"
    - "sequence 不参与 eligibility"

eligible_ordering:
  rule: "eligible 集合必须使用确定性排序"
  key:
    - "service.id"
  note: "freight.service 当前无业务排序字段，以 id 升序作为确定性顺序；后续若增加排序字段再替换"
  purpose:
    - "保证 wizard 行顺序稳定"
    - "保证 sequence 稳定"

snapshot_fields:
  tax_amount:
    readonly: true
    client_editable: false
    server_source: "_prepare_wizard_line(service) 按 service.sale * qty * tax_rate 计算"
  settlement_rate:
    readonly: true
    client_editable: false
    server_source: "_prepare_wizard_line(service) 按公司币种折算"

readonly_policy:
  view:
    - "tax_amount readonly"
    - "settlement_rate readonly"
  model:
    - "不能通过普通用户 write 改变 snapshot"
  semantics:
    - "readonly 仅针对 Wizard snapshot"
    - "不修改 freight.service 原始费用模型"

architecture_boundary:
  allowed:
    - "wizard 内建立统一 eligibility helper"
  forbidden:
    - "改变既有 fee_state 状态机"
    - "改变 Statement occupancy 事实来源"
    - "改变现有模型字段语义"
    - "为了本 Sprint 修改 models/ 下业务规则"
  exception:
    - "发现 wizard 依赖的既有模型事实与 B-61~B-69 冲突时，停止并升级，不自行扩 scope"

decision_dependencies:
  - "B-55 current fee lock semantics"
  - "B-68 fee_state remains sole occupancy authority"
  - "B-52 为历史版本，本 Sprint 不引用"

forbidden_implementation_patterns:
  - "name + qty + price matching"
  - "fuzzy matching service"
  - "多个 eligibility helper 各自实现业务规则"
  - "write() 无条件重建 line_ids"
  - "compute_selectable() 修改 select"
  - "rebuild_lines() 修改用户选择状态，除非该事件属于明确 reset 事件"
  - "generate 时静默过滤不可选 selected line"
  - "仅依赖 XML domain 进行 customer invariant 校验"
  - "仅在 FOR UPDATE 前校验 eligibility"
  - "使用 snapshot 字段恢复 service_id"

code_cleanup:
  must_remove:
    - "旧 service_id 猜测恢复 helper"
    - "旧 snapshot → service reverse lookup"
    - "重复 eligibility helper"
    - "无明确生命周期意义的 line rebuild 路径"
  must_not_leave:
    - "dead code"
    - "兼容旧逻辑的 fallback"
    - "try/except 猜测恢复"
    - "多个 service matching 分支"

acceptance_criteria:
  functional:
    - "打开向导时 eligible 费用行默认全部勾选（B-69）"
    - "打开向导即绑定 eligible 行，service_id 全部非空"
    - "打开 A/B/C 全选 → 取消 B → 普通 wizard write/onchange → B 仍为 False（取消不被普通 write 恢复）"
    - "客户 A 取消 A2 → 切换客户 B → 全部重建且 select=True，不残留 A 行"
    - "打开 wizard 后另一事务把 A 变为 used → Generate → FOR UPDATE 后全量重校验失败，不创建 Statement"
    - "客户端删除 eligible line（2/3/5 命令）→ 服务端按 eligible 重建，不能绕过 eligibility/selection"
    - "全部取消后 Generate → ValidationError，不创建空 Statement"
    - "用户只勾选 800 元场站费生成成功，且不会残留其他客户费用（如 CAT320D2）"
    - "勾选不可选行（fee_state 变化/已占用）时给出明确错误，且不静默过滤"
    - "customer_id 非本货单 shipper/consignee 时给出明确错误（服务端校验）"
    - "锁后 invoiced 或 active statement 状态变化被拦截"
    - "tax_amount/settlement_rate 在视图中只读且模型层不可被普通用户写"
    - "无 service_id 且无法绑定的行：明确报错，不猜测"
  refactor_acceptance:
    - "不存在 name + qty + price service_id 恢复代码"
    - "不存在第二套 eligibility 判断逻辑"
    - "所有 eligible service → wizard.line 均直接绑定 service_id"
    - "普通 write 不触发行集合 rebuild"
    - "customer onchange 明确触发行集合 rebuild"
    - "select 状态不会被普通 write 覆盖"
    - "rebuild 时 select 按契约初始化"
    - "Statement 创建只使用 wizard.line.service_id"
    - "snapshot 字段不参与 service identity resolution"
  non_regression:
    - "B-55/B-59/B-60 相关规则不变"
    - "Sprint4-4-2 并发行锁与 fee_state 占用写回保留"
    - "原生 checkbox 列表不打开行表单、不产生空行"
  validation:
    - "context_loader.py 基线 PASS（bind 0.1.74）"
    - "verify.py 全部强制门禁 PASS"
    - "XML-RPC 模块升级验证通过"
    - "wizard_lifecycle_tests 全部通过"
    - "refactor_review 经人工批准"
    - "业务负责人人工验收通过"

validation:
  context:
    required_version: "0.1.74"
    command: "context_loader.py"
    expected: "PASS"
    bind_version_must_match: true
  static:
    - "verify.py 全部强制门禁 PASS"
  build:
    - "Python/XML/Odoo19 兼容校验 PASS"
  runtime:
    - "常驻 Odoo + button_immediate_upgrade 通过"
    - "odoo shell 断言：生命周期/三态/身份/锁后全量校验/customer/sequence"
    - "浏览器人工验证：原生 checkbox 可用，勾选/取消/客户切换/Generate"
  business_review:
    - "U-45 → B-69 已确认（默认全选），业务负责人验收通过"
  snapshot:
    verify_gate_count: 18
    note: "verify.py 18 项门禁为当前基线"

wizard_lifecycle_tests:
  identity:
    - "create 后所有 line.service_id 非空"
    - "每个 line.service_id 对应 eligible service"
    - "不存在 snapshot 反向恢复"
  selection:
    - "首次打开全部 select=True"
    - "取消某行后普通 write 不恢复"
    - "普通 write 后 line 集合不变化"
    - "customer change 后 line 集合按新 eligible 重建"
    - "customer change 后 select 按 B-69 重置"
  eligibility:
    - "_eligible_services_for 与 _compute_selectable 使用同一 helper"
    - "修改 helper 后两者结果一致"
  generation:
    - "selected + selectable 校验"
    - "不可选 selected 行不能被静默过滤"
    - "customer invariant"
    - "FOR UPDATE 后重新 eligibility"
  identity_integrity:
    - "Statement Line 来源为 wizard.line.service_id"
    - "snapshot 不参与 identity resolution"
  negative:
    - "人为构造 service_id=False 的 wizard line → 明确错误"
    - "人为注入不存在/不属于 shipment 的 service → 明确错误"
    - "模拟 fee_state 并发变化 → 阻止生成"
    - "模拟 active statement 占用变化 → 阻止生成"

refactor_review:
  removed:
    - "旧 service_id 猜测恢复"
    - "旧 eligibility 分支"
  added:
    - "_is_service_eligible"
    - "_rebuild_lines"
  changed:
    - "create"
    - "onchange_customer"
    - "write"
    - "action_generate_statement"
  lifecycle:
    before: "snapshot 数据驱动 + service_id 猜测恢复"
    after: "eligible service 驱动 + service_id 创建即绑定 + select 独立保存"
  state_ownership:
    eligible: "_is_service_eligible() 唯一事实来源"
    selectable: "_compute_selectable() 调用同一 helper"
    select: "wizard.line.select 用户独立状态"
  proof:
    - "普通 write 不 rebuild"
    - "customer change rebuild"
    - "service_id direct binding"

validation_policy:
  static_pass:
    meaning: "仅表示代码/契约门禁通过"
  runtime_pass:
    meaning: "仅表示模块可加载、基本调用成功"
  functional_pass:
    required:
      - "真实 wizard UI 操作"
      - "真实 checkbox 勾选/取消"
      - "真实 customer 切换"
      - "真实 Generate Statement"
      - "真实并发状态变化"
  completion:
    required:
      - "all static gates PASS"
      - "all runtime tests PASS"
      - "all acceptance scenarios PASS"
      - "refactor_review 人工批准"
      - "human browser acceptance PASS"

success_definition:
  architecture:
    - "Wizard Line 由 eligible service 集合唯一驱动"
    - "service_id 创建即绑定，成为业务身份锚点"
    - "snapshot 不承担 identity resolution"
    - "eligible/selectable/select 三者职责分离"
    - "rebuild 入口明确且数量受控"
    - "普通 write 不触发 rebuild"
  behavior:
    - "初次打开 eligible 全部 select=True"
    - "用户取消选择后普通 write 保留选择状态"
    - "customer change 重建 eligible 并按契约重置选择"
    - "不可 selectable 的 selected 行不能生成"
  concurrency:
    - "FOR UPDATE 后重新执行完整 eligibility"
  integrity:
    - "customer ownership 显式校验"
    - "service_id 缺失不得猜测恢复"
  validation:
    - "所有强制门禁通过"
    - "生命周期专项测试全部通过"
    - "refactor_review 经人工批准"
    - "人工验收通过"

loop_policy:
  max_iteration: 5
  retry_scope:
    mode: "affected_asset_only"
  scope_expansion:
    allowed: false
    require_human: true
  stop_condition:
    success:
      - all_validation_pass
      - refactor_review_approved
      - human_accept
    hard_stop:
      - risk_block
      - scope_violation
      - forbidden_change
      - new_unknown

affected_assets:
  business:
    - "B-61 ~ B-69 decision registration"
  architecture: []
  governance: []
  history:
    - decision_note
    - sprint_log

execution_artifacts:
  intent_records:
    - "docs/context/intent_records/INT-FREIGHT-SPRINT4-4-4-001/"
  validation_records:
    - "docs/context/validation/test_exec_records.yaml"
  context_version:
    - "docs/context/context_version.yaml"

deliverables:
  - "Phase 0 只读生命周期分析报告"
  - "Phase 1 目标生命周期/方法职责/rebuild 矩阵（人审）"
  - "wizard 生命周期与状态所有权重构代码"
  - "eligibility 单一 helper"
  - "生命周期专项测试 + 并发测试"
  - "Phase 4 Refactor Review 报告（人审）"
  - "决策记录（B-61~B-69）与执行记录"

audit:
  intent_records: "docs/context/intent_records/INT-FREIGHT-SPRINT4-4-4-001/"

risk_precheck:
  - "forbidden_change.yaml 基线扫描"
  - "verify.py 全部强制门禁"
  - "Git diff scope check（scope.allowed_files / forbidden_paths）"
  - "Phase 0 只读分析完成且未修改任何文件"
  - "确认未改费用/Statement 状态机与占用事实来源"
  - "确认移除 name+qty+price 猜测逻辑"
