  - "B-36/B-52 SUPERSEDED 标注完成；B-50/B-53 与 B-54/B-55 口径一致"
  - "Sprint4-3 业务流含 unconfirm 路径；Sprint4-4 无残留 U-40 文案"
  - "并发双开测试通过；statement_locked deprecated 标注完成"
