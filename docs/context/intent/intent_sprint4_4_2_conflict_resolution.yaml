  - "Sprint4-3/4-4/4-4-1 契约文案修订"
  - "statement 创建并发保护 + 并发测试"
  - "statement_locked deprecated 标注"
  - "决策/执行记录更新"

audit:
  intent_records: "docs/context/intent_records/INT-FREIGHT-SPRINT4-4-2-001/"

risk_precheck:
