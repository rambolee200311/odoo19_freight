# 禁止修改清单（forbidden_change.yaml）
# 发布: 2026-08-11
# 适配: odoo19_freight / tk_freight
# AI Agent 必须严格遵守，触碰即违规

version: 0.1.0

# ========== 架构层约束 ==========
architecture:
  - target: "Odoo 官方源码"
    rule: "禁止修改 ./odoo 与 ./addons 任何代码"
    risk: "破坏 Odoo 基础行为与项目可控性"

  - target: "Odoo 官方源码阅读"
    rule: "禁止阅读/解析/跟进 Odoo 官方源码作为开发依据"
    risk: "违反项目约束，开发仅围绕 tk_freight 自定义代码"

  - target: "视图层直接读写数据库"
    rule: "禁止在 XML 视图/JS/Controller 中执行 SQL 或 bypass ORM"
    risk: "违反 Odoo 三层架构"

  - target: "模块边界"
    rule: "禁止修改 tk_freight 之外的自定义模块"
    risk: "超出业务范围"

# ========== 数据层约束 ==========
data:
  - target: "数据库直连"
    rule: "禁止使用 self.env.cr.execute 绕过 ORM 写数据"
    risk: "违反 Odoo 模型层规范"

  - target: "数据检查方式"
    rule: "数据检查一律使用 odoo shell，非万不得已禁止直连数据库操作"
    risk: "违反铁律，绕过 ORM 与审计链路"

  - target: "存量数据"
    rule: "禁止无计划、无迁移脚本的批量数据修改"
    risk: "不可审计、不可回滚"

# ========== 功能层约束 ==========
feature:
  - target: "已确认业务口径"
    rule: "禁止未经决策笔记修改收入/成本/币种/税费/利润口径"
    risk: "财务数据失真"

  - target: "遗留兼容字段"
    rule: "禁止删除 deprecated 字段、方法、shipment.invoice 向导"
    risk: "破坏兼容性"

  - target: "未定需求"
    rule: "报表需求、角色权限、门户写权限、U8C 接口未确认前禁止实施"
    risk: "返工与范围溢出"

# ========== 安全层约束 ==========
security:
  - target: "security group"
    rule: "禁止删除或停用已有 security group"
    risk: "影响多用户访问权限"

  - target: "portal 权限"
    rule: "portal 写权限收敛待角色方案确定，禁止擅自调整"
    risk: "权限方案未定，提前改动会返工"

# ========== 审计规则 ==========
audit:
  check_before_commit:
    - "确认无 Scope forbid 中任何违规项"
    - "确认无 Odoo 底层/原生模块代码修改"
    - "确认无直连 SQL 规避 ORM"
    - "确认所有新增字段在 intent scope allow 范围内"
    - "确认视图字段显隐规则正确无误"
    - "确认 docs/context 版本号与本次变更同步"

# ========== 新增例外 ==========
soft_reference_allow: []

# ========== 技术红线 ==========
controller_bypass:
  - target: "不必要的 Controller JSON 路由"
    rule: "禁止为了给前端 JS 提供数据而新增 Controller HTTP/JSON 路由"
    rationale: >
      Odoo OWL 前端通过 useService("orm") 可直接调用 search_read、read、call 等标准 ORM API，
      无需 Controller 层中转。新增 Controller 路由增加了维护面、绕过了 ORM 的权限和安全校验。
    exception: "QWeb 页面渲染路由（type='http' 返回模板）、文件下载等 ORM 无法覆盖的场景"
    effect: "前端交互统一走 orm.searchRead / orm.call / orm.create，不新增 JSON Controller"

# ========== 模块升级铁律 ==========
module_upgrade:
  - target: "模块升级方式"
    rule: "一律用常驻方式启动 Odoo，通过 XML-RPC 调用 button_immediate_upgrade 升级模块"
    risk: "违反人类工程师升级流程，无法复现 UI 等效升级"
  - target: "升级错误处理"
    rule: "升级失败必须检查 odoo.conf 指定 logfile（debug_logs/odoo_190.log）"
    risk: "掩盖真实错误"
  - target: "最终验证"
    rule: "禁止仅用 `-u --stop-after-init` 作为模块升级最终验证"
    risk: "无法复现人类工程师升级过程"
