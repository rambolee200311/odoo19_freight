# ==============================================
# 测试/开发教训（context_loader 风险注入输入）
# ==============================================

test_lessons_version: "0.1.5"
source_sprints: ["Sprint0"]

rules:

  - id: "TL-FREIGHT-001"
    category: "onchange 落库"
    source: "现状梳理"
    problem: "create() 后调用 _onchange_address() 但不 write()，起运/目的地址字段不保存"
    rule: "create 后如需地址字段，必须显式 write 或使用计算字段"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-002"
    category: "多币种核算"
    source: "现状梳理"
    problem: "货单账务把不同币种 amount_total_signed 直接相加，未折算公司本位币"
    rule: "所有货单级汇总必须先经 res.currency._convert 折算人民币"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-003"
    category: "成本口径"
    source: "现状梳理"
    problem: "供应商账单与成本汇总使用 sale 而非 cost"
    rule: "vendor 行必须用成本价参与应付与利润计算"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-004"
    category: "发票状态回写"
    source: "现状梳理"
    problem: "发票/账单状态变化不回写服务行，作废/红冲后 invoiced 标志滞留"
    rule: "account.move 状态变化必须同步 freight.service 与货单账务"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-005"
    category: "配置参数类型"
    source: "现状梳理"
    problem: "ir.config_parameter 返回字符串，weight_ratio 参与比较/除法报错"
    rule: "读取配置参数后必须 float() 转换再参与运算"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-006"
    category: "验证纪律"
    source: "Sprint4-4-4 Wizard 复盘（2026-08-14）"
    problem: "反复以 odoo shell 服务端断言冒充端到端测试，未做真实浏览器点击验证，导致用户侧连续报错"
    rule: "声称测试通过前必须完成真实浏览器点击验证；服务端断言只能标注为服务端已验证"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-007"
    category: "数据关联契约"
    source: "Sprint4-4-4 Wizard 复盘（2026-08-14）"
    problem: "wizard 瞬态行 service_id 被网页端重建丢失后，用 name+qty+price 猜测恢复业务关联"
    rule: "One2many 行与业务对象关联必须创建即绑定并在视图层保留；禁止猜测式恢复关联"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-008"
    category: "修复纪律"
    source: "Sprint4-4-4 Wizard 复盘（2026-08-14）"
    problem: "同一症状反复出现仍继续打补丁，未先定位根因、未先钉死数据契约"
    rule: "同一问题第三次出现必须停止编码，先查真实 UI/数据库状态并重新确认契约"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-009"
    category: "wizard 选择机制"
    source: "Sprint4-4-4 Wizard 最终修复（2026-08-14）"
    problem: "One2many 瞬态行 checkbox 被网页端重建后选择状态与服务端脱节，write 命令守卫越叠越错"
    rule: "wizard 多选直接使用 Many2many 原生控件（many2many_tags / many2many_checkboxes）挂在真实业务对象上；禁止用 One2many checkbox + write 命令守卫实现选择状态"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-010"
    category: "UI 需求与选择保留"
    source: "Sprint4-4-4 Wizard 最终复盘（2026-08-14）"
    problem: "wizard 多选在稳定（Many2many）与表格展示（One2many）之间反复横跳 4 种方案、11 次打回；只追求稳定牺牲了业务需要的表格列"
    rule: "变更 wizard 选择机制前必须先固化用户可见展示需求（列/勾选/默认态）与验收标准；保留 One2many 表格时重建必须用 select_map 显式保留选择，禁止猜测网页端命令"
    severity: "LEVEL2"

  - id: "TL-FREIGHT-011"
    category: "先查参考再动手"
    source: "Sprint4-4-4 Wizard 最终复盘（2026-08-14）"
    problem: "wizard 实现卡了 8 小时，未先查阅框架源码与项目已有 wizard 参考（DeliveryOrderNewWizard、many2many_checkboxes），反复自造复杂方案"
    rule: "实现不熟悉的 UI 交互（wizard/勾选/多选）前必须先搜索框架源码与项目内已有实现作为参考，再定机制；禁止直接凭假设写代码并在失败后继续打补丁"
    severity: "LEVEL2"

  # ==============================================
  # 项目级 AI Coding Governance（通用规则，非 freight 专属）
  # ==============================================
  - id: "TL-001"
    category: "AI Coding Governance"
    source: "Wizard 8 小时复盘（2026-08-14）"
    problem: "业务需求未先固化为 UI 契约，直接选择 One2many checkbox，随后在按钮/tags/checkboxes 之间反复横跳"
    rule: "UI Contract First：先确定用户必须看到和操作什么，再选择技术机制"
    severity: "LEVEL1"

  - id: "TL-002"
    category: "AI Coding Governance"
    source: "Wizard 8 小时复盘（2026-08-14）"
    problem: "未查项目已有 wizard 参考与框架原生控件，凭模型记忆假设 Odoo 行为"
    rule: "Reference Before Coding：实现不熟悉的框架/UI 行为前，必须先搜索项目已有实现、框架源码或官方文档；禁止凭假设直接编码"
    severity: "LEVEL1"

  - id: "TL-003"
    category: "AI Coding Governance"
    source: "Wizard 8 小时复盘（2026-08-14）"
    problem: "用 name+qty+price 等展示字段猜测 service_id 业务关联"
    rule: "Business Object Is Source of Truth：Wizard 行只是 UI 投影，业务事实必须来自真实业务对象，禁止通过展示字段猜测业务关联"
    severity: "LEVEL1"

  - id: "TL-004"
    category: "AI Coding Governance"
    source: "Wizard 8 小时复盘（2026-08-14）"
    problem: "反复以 odoo shell 服务端断言冒充浏览器/E2E 验证，声称测试通过后用户仍无法完成业务"
    rule: "Validation Level Must Be Honest：Shell/ORM/API 验证不得冒充浏览器/E2E 验证；未完成真实用户操作不得宣称功能测试通过"
    severity: "LEVEL1"

  - id: "TL-005"
    category: "AI Coding Governance"
    source: "Wizard 8 小时复盘（2026-08-14）"
    problem: "同一用户症状连续失败多次仍继续 patch，方向错误越修越完整"
    rule: "Three Failures Trigger Re-analysis：同一症状连续失败三次必须停止 patch，重新检查 UI Contract、数据契约和框架机制"
    severity: "LEVEL1"
